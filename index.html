creed:"Credo in Deum Patrem omnipoténtem, Creatórem cæli et terræ. Et in Iesum Christum, Fílium eius unicum, Dóminum nostrum, qui concéptus est de Spíritu Sancto, natus ex Maria Vírgine, passus sub Póntio Piláto, crucifíxus, mórtuus, et sepúltus, descéndit ad ínferos, tértia die resurréxit a mórtuis, ascéndit ad cælos, sedet ad déxteram Dei Patris omnipoténtis, inde ventúrus est iudicáre vivos et mórtuos.\nCredo in Spíritum Sanctum, sanctam Ecclésiam cathólicam, sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, vitam ætérnam. Amen.",
fatima:"O mi Iesu, dimítte nobis débita nostra, líbera nos ab igne inférni, perduc in cælum omnes ánimas, præsértim eas quæ misericórdiæ tuæ máxime indigent.",
queen:"Salve, Regína, Mater misericórdiæ, vita, dulcédo, et spes nostra, salve. Ad te clamámus, éxsules fílii Evæ. Ad te suspirámus, geméntes et flentes in hac lacrimárum valle.\nEia ergo, advocáta nostra, illos tuos misericórdes óculos ad nos convérte. Et Iesum, benedíctum fructum ventris tui, nobis post hoc exsílium osténde.\nO clemens, O pia, O dulcis Virgo María.",
memorare:"Memorare, O piíssima Virgo María, non esse audítum a sǽculo, quemquam ad tua curréntem præsídia, tua implorántem auxília, tua peténtem suffrágia, esse derelíctum. Ego tali animátus confidéntia, ad te, Virgo Vírginum, Mater, curro, ad te vénio, coram te gemens peccátor assísto. Noli, Mater Verbi, verba mea despícere; sed áudi propítia et exáudi. Amen.",
michael:"Sancte Michaël Archángele, defénde nos in prœlio; contra nequítiam et insídias diáboli esto præsídium. Imperet illi Deus, súpplices deprecámur: tuque, Princeps milítiæ cæléstis, Satánam aliósque spíritus malígnos, qui ad perditiónem animárum pervagántur in mundo, divína virtúte in infernum detrúde. Amen.",
angel:"Ángele Dei, qui custos es mei, me tibi commíssum pietáte supérna; illúmina, custódi, rege et gubérna. Amen.",
grace:"Benedic, Dómine, nos et hæc tua dona, quæ de tua largitáte sumus sumptúri. Per Christum Dóminum nostrum. Amen.",
after:"Agimus tibi grátias, omnípotens Deus, pro univérsis benefíciis tuis, qui vivis et regnas in sǽcula sæculórum. Amen."
};

Object.assign(P,{
offering:['Morning Offering',`O Jesus, through the Immaculate Heart of Mary, I offer you my prayers, works, joys and sufferings of this day, for all the intentions of your Sacred Heart, in union with the Holy Sacrifice of the Mass throughout the world, for the salvation of souls, the reparation of sins, and the reunion of all Christians. Amen.`],
come:['Come, Holy Spirit',`Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love.
V. Send forth your Spirit and they shall be created.
R. And you shall renew the face of the earth.
Let us pray. O God, who instructed the hearts of the faithful by the light of the Holy Spirit, grant that in the same Spirit we may be truly wise and always rejoice in his consolation. Through Christ our Lord. Amen.`],
angelus:['The Angelus',`V. The Angel of the Lord declared unto Mary.
R. And she conceived of the Holy Spirit.
Hail Mary…
V. Behold the handmaid of the Lord.
R. Be it done unto me according to your word.
Hail Mary…
V. And the Word was made flesh.
R. And dwelt among us.
Hail Mary…
V. Pray for us, O holy Mother of God.
R. That we may be made worthy of the promises of Christ.
Let us pray. Pour forth, we beseech you, O Lord, your grace into our hearts; that we, to whom the incarnation of Christ your Son was made known by the message of an angel, may by his passion and cross be brought to the glory of his resurrection. Through the same Christ our Lord. Amen.`],
regina:['Regina Caeli (Easter season)',`Queen of Heaven, rejoice, alleluia. For he whom you did merit to bear, alleluia, has risen as he said, alleluia. Pray for us to God, alleluia.
V. Rejoice and be glad, O Virgin Mary, alleluia.
R. For the Lord has truly risen, alleluia.
Let us pray. O God, who gave joy to the world through the resurrection of your Son, our Lord Jesus Christ, grant, we beseech you, that through the intercession of the Virgin Mary, his Mother, we may obtain the joys of everlasting life. Through the same Christ our Lord. Amen.`],
subtuum:['Sub Tuum Praesidium',`We fly to your patronage, O holy Mother of God; despise not our petitions in our necessities, but deliver us always from all dangers, O glorious and blessed Virgin.`],
joseph:['Prayer to St. Joseph',`To you, O blessed Joseph, we have recourse in our tribulation, and having implored the help of your most holy Spouse, we confidently invoke your patronage also. Through that charity which bound you to the Immaculate Virgin Mother of God and through the paternal love with which you embraced the Child Jesus, we humbly beg you graciously to regard the inheritance which Jesus Christ purchased by his Blood, and with your power and strength to aid us in our necessities.
O most watchful guardian of the Holy Family, defend the chosen children of Jesus Christ; O most loving father, ward off from us every contagion of error and corrupting influence; O our most mighty protector, be kind to us and from heaven assist us in our struggle with the powers of darkness. As once you rescued the Child Jesus from deadly peril, so now defend God's Holy Church from the snares of the enemy and from all adversity; shield each one of us by your constant protection, so that, supported by your example and your aid, we may live piously, die holily, and obtain eternal happiness in heaven. Amen.`],
francis:['Peace Prayer (attributed to St. Francis)',`Lord, make me an instrument of your peace: where there is hatred, let me sow love; where there is injury, pardon; where there is doubt, faith; where there is despair, hope; where there is darkness, light; where there is sadness, joy.
O Divine Master, grant that I may not so much seek to be consoled as to console; to be understood as to understand; to be loved as to love. For it is in giving that we receive; it is in pardoning that we are pardoned; and it is in dying that we are born to eternal life. Amen.`],
teresa:['St. Teresa of Avila: Let Nothing Disturb You',`Let nothing disturb you, nothing frighten you; all things are passing. God never changes. Patience obtains all things. Whoever has God lacks nothing: God alone suffices.`],
ignatius:['St. Ignatius: Suscipe',`Take, Lord, and receive all my liberty, my memory, my understanding, and my entire will, all that I have and possess. You have given all to me. To you, Lord, I return it. All is yours; dispose of it wholly according to your will. Give me only your love and your grace, for this is enough for me. Amen.`],
patrick:['St. Patrick\'s Breastplate (excerpt)',`Christ with me, Christ before me, Christ behind me, Christ in me, Christ beneath me, Christ above me, Christ on my right, Christ on my left, Christ when I lie down, Christ when I sit down, Christ when I arise, Christ in the heart of everyone who thinks of me, Christ in the mouth of everyone who speaks of me, Christ in every eye that sees me, Christ in every ear that hears me.`],
communion:['Before Communion',`Lord, I am not worthy that you should enter under my roof; but only say the word and my soul shall be healed.`],
anima:['Anima Christi (after Communion)',`Soul of Christ, sanctify me.
Body of Christ, save me.
Blood of Christ, inebriate me.
Water from the side of Christ, wash me.
Passion of Christ, strengthen me.
O good Jesus, hear me.
Within your wounds hide me.
Suffer me not to be separated from you.
From the malicious enemy defend me.
In the hour of my death call me, and bid me come to you, that with your saints I may praise you forever and ever. Amen.`],
fhl:['Acts of Faith, Hope & Love',`FAITH: O my God, I firmly believe that you are one God in three Divine Persons, Father, Son and Holy Spirit. I believe these and all the truths which the Holy Catholic Church teaches, because you have revealed them, who can neither deceive nor be deceived.
HOPE: O my God, relying on your almighty power and infinite mercy and promises, I hope to gain pardon of my sins, the help of your grace, and life everlasting, through the merits of Jesus Christ, my Lord and Redeemer.
LOVE: O my God, I love you above all things, with my whole heart and soul, because you are all good and worthy of all love. I love my neighbor as myself for the love of you. I forgive all who have injured me, and ask pardon of all whom I have injured.`],
eternal:['Eternal Rest (for the departed)',`Eternal rest grant unto them, O Lord, and let perpetual light shine upon them. May they rest in peace. Amen.`],
opening:['Opening Versicle',`O God, come to my assistance.
O Lord, make haste to help me.
Glory be to the Father… (see Glory Be)`],
resp:['Compline Responsory',`Into your hands, O Lord, I commend my spirit.`],
benedictus:['Canticle of Zechariah (Benedictus, Lauds)',`Blessed be the Lord God of Israel; because he hath visited and wrought the redemption of his people: And hath raised up a horn of salvation to us, in the house of David his servant, As he spoke by the mouth of his holy prophets, who are from the beginning: Salvation from our enemies, and from the hand of all that hate us: To perform mercy to our fathers, and to remember his holy testament, The oath, which he swore to Abraham our father, that he would grant to us, That being delivered from the hand of our enemies, we may serve him without fear, In holiness and justice before him, all our days.
And thou, child, shalt be called the prophet of the Highest: for thou shalt go before the face of the Lord to prepare his ways: To give knowledge of salvation to his people, unto the remission of their sins: Through the bowels of the mercy of our God, in which the Orient from on high hath visited us: To enlighten them that sit in darkness, and in the shadow of death: to direct our feet into the way of peace.`],
magnificat:['Canticle of Mary (Magnificat, Vespers)',`My soul doth magnify the Lord. And my spirit hath rejoiced in God my Saviour. Because he hath regarded the humility of his handmaid; for behold from henceforth all generations shall call me blessed. Because he that is mighty hath done great things to me; and holy is his name. And his mercy is from generation unto generations, to them that fear him.
He hath shewed might in his arm: he hath scattered the proud in the conceit of their heart. He hath put down the mighty from their seat, and hath exalted the humble. He hath filled the hungry with good things; and the rich he hath sent empty away. He hath received Israel his servant, being mindful of his mercy: As he spoke to our fathers, to Abraham and to his seed for ever.`],
nunc:['Canticle of Simeon (Nunc Dimittis, Compline)',`Now thou dost dismiss thy servant, O Lord, according to thy word in peace; Because my eyes have seen thy salvation, Which thou hast prepared before the face of all peoples: A light to the revelation of the Gentiles, and the glory of thy people Israel.`]
});

subtuum:`Sub tuum præsídium confúgimus, sancta Dei Génetrix; nostras deprecatiónes ne despícias in necessitátibus, sed a perículis cunctis líbera nos semper, Virgo gloriósa et benedícta.`,
communion:`Dómine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur ánima mea.`,
anima:`Anima Christi, sanctífica me.
Corpus Christi, salva me.

Object.assign(L,{
contrition:`Deus meus, ex toto corde pænitet me ómnium meórum peccatórum, eáque détestor, quia peccándo, non solum pœnas a te iuste statútas proméritus sum, sed præsértim quia offéndi te, summum bonum, ac dígnum qui super ómnia diligáris. Ídeo fírmiter propóno, adiuvánte grátia tua, de cétero me non peccatúrum peccandíque occasiónes próximas fugitúrum. Amen.`,
come:`Veni, Sancte Spíritus, reple tuórum corda fidélium, et tui amóris in eis ignem accénde.\nV. Emítte Spíritum tuum et creabúntur.\nR. Et renovábis fáciem terræ.\nOrémus. Deus, qui corda fidélium Sancti Spíritus illustratióne docuísti, da nobis in eódem Spíritu recta sápere, et de eius semper consolatióne gaudére. Per Christum Dóminum nostrum. Amen.`,
angelus:`V. Angelus Dómini nuntiávit Maríæ.\nR. Et concépit de Spíritu Sancto.\nAve María…\nV. Ecce ancílla Dómini.\nR. Fiat mihi secúndum verbum tuum.\nAve María…\nV. Et Verbum caro factum est.\nR. Et habitávit in nobis.\nAve María…\nV. Ora pro nobis, sancta Dei Génetrix.\nR. Ut digni efficiámur promissiónibus Christi.\nOrémus. Grátiam tuam, quǽsumus, Dómine, méntibus nostris infúnde: ut qui, Angelo nuntiánte, Christi Fílii tui incarnatiónem cognóvimus, per passiónem eius et crucem ad resurrectiónis glóriam perducámur. Per eúndem Christum Dóminum nostrum. Amen.`,
regina:`Regína cæli, lætáre, allelúia: quia quem meruísti portáre, allelúia, resurréxit, sicut dixit, allelúia: ora pro nobis Deum, allelúia.\nV. Gaude et lætáre, Virgo María, allelúia.\nR. Quia surréxit Dóminus vere, allelúia.\nOrémus. Deus, qui per resurrectiónem Fílii tui, Dómini nostri Iesu Christi, mundum lætificáre dignátus es: præsta, quǽsumus; ut per eius Genetrícem Vírginem Maríam, perpétuæ capiámus gáudia vitæ. Per eúndem Christum Dóminum nostrum. Amen.`,
ignatius:`Súscipe, Dómine, univérsam meam libertátem. Accipe memóriam, intelléctum atque voluntátem omnem. Quidquid hábeo vel possídeo mihi largítus es; id tibi totum restítuo, ac tuæ prorsus voluntáti trado gubernándum. Amórem tui solum cum grátia tua mihi dones, et dives sum satis, nec áliud quidquam ultra pósco. Amen.`,
benedictus:`Benedíctus Dóminus Deus Israël, quia visitávit et fecit redemptiónem plebis suæ, et eréxit cornu salútis nobis in domo David púeri sui, sicut locútus est per os sanctórum, qui a sǽculo sunt, prophetárum eius, salútem ex inimícis nostris et de manu ómnium qui odérunt nos, ad faciéndam misericórdiam cum pátribus nostris et memorári testaménti sui sancti, iusiurándum, quod iurávit ad Ábraham patrem nostrum, datúrum se nobis, ut sine timóre, de manu inimicórum nostrórum liberáti, serviámus illi in sanctitáte et iustítia coram ipso ómnibus diébus nostris.\nEt tu, puer, prophéta Altíssimi vocáberis: præíbis enim ante fáciem Dómini paráre vias eius, ad dandam sciéntiam salútis plebi eius in remissiónem peccatórum eórum, per víscera misericórdiæ Dei nostri, in quibus visitábit nos óriens ex alto, illumináre his qui in ténebris et in umbra mortis sedent, ad dirigéndos pedes nostros in viam pacis.`,
magnificat:`Magníficat ánima mea Dóminum, et exsultávit spíritus meus in Deo salvatóre meo, quia respéxit humilitátem ancíllæ suæ. Ecce enim ex hoc beátam me dicent omnes generatiónes, quia fecit mihi magna qui potens est, et sanctum nomen eius, et misericórdia eius in progénies et progénies timéntibus eum.\nFecit poténtiam in bráchio suo, dispérsit supérbos mente cordis sui; depósuit poténtes de sede et exaltávit húmiles; esuriéntes implévit bonis et dívites dimísit inánes. Suscépit Ísrael púerum suum, recordátus misericórdiæ suæ, sicut locútus est ad patres nostros, Ábraham et sémini eius in sǽcula.`,
nunc:`Nunc dimíttis servum tuum, Dómine, secúndum verbum tuum in pace: quia vidérunt óculi mei salutáre tuum, quod parásti ante fáciem ómnium populórum: lumen ad revelatiónem géntium, et glóriam plebis tuæ Israël.`,
loreto:`Kýrie, eléison. Christe, eléison. Kýrie, eléison.\nChriste, audi nos. Christe, exáudi nos.\nPater de cælis, Deus, miserére nobis.\nFili, Redémptor mundi, Deus, miserére nobis.\nSpíritus Sancte, Deus, miserére nobis.\nSancta Trínitas, unus Deus, miserére nobis.\n\nSancta María, ora pro nobis.\nSancta Dei Génetrix\nSancta Virgo vírginum\nMater Christi\nMater Ecclésiæ\nMater misericórdiæ\nMater divínæ grátiæ\nMater spei\nMater puríssima\nMater castíssima\nMater invioláta\nMater intemeráta\nMater amábilis\nMater admirábilis\nMater boni consílii\nMater Creatóris\nMater Salvatóris\nVirgo prudentíssima\nVirgo veneránda\nVirgo prædicánda\nVirgo potens\nVirgo clemens\nVirgo fidélis\nSpéculum iustítiæ\nSedes sapiéntiæ\nCausa nostræ lætítiæ\nVas spirituále\nVas honorábile\nVas insígne devotiónis\nRosa mýstica\nTurris Davídica\nTurris ebúrnea\nDomus áurea\nFoéderis arca\nIánua cæli\nStella matutína\nSalus infirmórum\nRefúgium peccatórum\nSolácium migrántium\nConsolátrix afflictórum\nAuxílium Christianórum\nRegína Angelórum\nRegína Patriarchárum\nRegína Prophetárum\nRegína Apostolórum\nRegína Mártyrum\nRegína Confessórum\nRegína Vírginum\nRegína Sanctórum ómnium\nRegína sine labe originális concépta\nRegína in cælum assúmpta\nRegína sacratíssimi Rosárii\nRegína famíliæ\nRegína pacis\n\nAgnus Dei, qui tollis peccáta mundi, parce nobis, Dómine.\nAgnus Dei, qui tollis peccáta mundi, exáudi nos, Dómine.\nAgnus Dei, qui tollis peccáta mundi, miserére nobis.\n\nV. Ora pro nobis, sancta Dei Génetrix.\nR. Ut digni efficiámur promissiónibus Christi.`

var BP=[
['I. Arrest and Binding',`In the garden you were overcome with sorrow, then seized and bound. For your anguish and the cords that held you, have mercy on me and free me from the bonds of my sins.`],
['II. The Scourging',`For the lashes you bore at the pillar and the blood that flowed from your body, heal the wounds of my soul and teach me to accept correction with humility.`],
['III. The Crown of Thorns',`For the thorns pressed into your head and the mockery of those who called you king, free me from pride and teach me to love the lowest place.`],
['IV. The Condemnation',`For your silence before unjust judges and the sentence you accepted though innocent, give me patience when I am wronged, and keep me from judging others harshly.`],
['V. Carrying the Cross',`For the weight of the cross and the long road with its falls, strengthen me to carry my own burdens in union with you.`],
['VI. Stripped of Your Garments',`For the shame of being stripped and the wounds torn open again, clothe me in your grace and keep me from every shameful sin.`],
['VII. The Nailing',`For the nails driven through your hands and feet, pierce my heart with love of you and free me from every disordered attachment.`],
['VIII. Lifted Up on the Cross',`For being raised on the cross, thirsting for souls, draw my heart to you and make me thirst for you above all things.`],
['IX. Your Words from the Cross',`For your prayer, Father, forgive them, and your promise to the repentant thief, forgive my sins and teach me to forgive those who hurt me.`],
['X. Your Mother and the Disciple',`For entrusting your mother to your beloved disciple, and for the sorrow that pierced her heart, make me faithful in love and a true child of the Church.`],
['XI. Abandonment',`For your cry, My God, why have you forsaken me, keep me from despair when God seems far, and let me trust you in the dark.`],
['XII. It Is Finished',`For the bitter drink offered to you and your word that it is finished, help me to complete the work you give me and to endure to the end.`],
['XIII. Into Your Hands',`For placing your spirit into your Father's hands, I commend to you my soul, my loved ones, and my last hour.`],
['XIV. Your Death',`For your death, the darkened sky and the shaking earth, grant me a holy death and eternal rest with you.`],
['XV. The Pierced Side',`For your side opened by the lance, and the blood and water that poured out, wash me clean, nourish me by the sacraments, and bring me at last to you.`]];

Object.assign(P,{
n_sick:['For the Sick',`Lord Jesus, you healed the sick and comforted the suffering. Look with mercy on those who are ill, especially those I carry in my heart. Give them strength and relief, patience in pain, and the comfort of your presence. Support their doctors and caregivers, and may your will be done in all things. Amen.`],
n_fear:['In Anxiety or Fear',`Lord, you are with me in every storm. Quiet my racing mind and steady my heart. Help me to hand over what I cannot control, and to trust that you hold my life in your hands. Jesus, I trust in you. Amen.`],
n_travel:['Before a Journey',`Lord, be with us on our journey. Guard us from danger, keep our way safe, and bring us home in peace. Holy Guardian Angels, watch over us. Amen.`],
n_study:['Before Study or an Exam',`Come, Holy Spirit, give me a clear mind and a calm heart. Help me to remember what I have learned and to do my best. Whatever the result, let me use my gifts for your glory and the good of others. Amen.`],
n_work:['For Work',`Lord, bless the work of my hands. Help me to do it faithfully, honestly, and with joy. Keep me from greed and from idleness, and let my labor serve you and my neighbor. St. Joseph the Worker, pray for me. Amen.`],
n_decide:['When Facing a Decision',`Come, Holy Spirit, give me light to see your will. Quiet my fears and my own desires, and give me courage to follow where you lead. Amen.`],
n_grief:['In Grief',`God of all comfort, you know my sorrow. Hold those who mourn, and give them hope in the resurrection. Grant rest to those who have died, and bring us all one day to your kingdom. Amen.`],
n_mother:['For Expectant Mothers',`Lord, giver of life, bless this child and its mother. Protect them in body and soul, grant a safe and peaceful birth, and make us grateful for your gift. Mary, Mother of God, pray for us. Amen.`],
n_dying:['For the Dying',`Merciful Jesus, be near those who are dying. Give them peace, forgive their sins, and welcome them into your arms. Mary, comfort them; St. Joseph, patron of a happy death, pray for them. Amen.

If someone is seriously ill or near death, ask a priest to come for the Anointing of the Sick.`],
n_family:['For My Family',`Lord, bless my family. Heal what is broken between us, keep us patient and kind, and make our home a place of peace. Holy Family of Nazareth, pray for us. Amen.`],
n_forgive:['To Forgive Someone',`Lord, I have been hurt, and I find it hard to forgive. Soften my heart. Give me the grace to forgive as you have forgiven me, and to pray for those who wronged me. Amen.`],
n_temptation:['In Temptation',`Lord, I am weak, and temptation is strong. Give me your strength, keep me from the near occasions of sin, and when I fall, lift me up. Mary, refuge of sinners, pray for me. Amen.`],
n_peace:['For Peace',`Lord God, Prince of Peace, bring an end to war and violence. Turn hearts from hatred, comfort the victims, and lead the nations to justice and peace. Amen.`],
n_thanks:['In Thanksgiving',`Thank you, Lord, for the gifts of this day: for life, for those I love, and for your mercy that never fails. Help me to notice your goodness and to share it with others. Amen.`],
n_vocation:['For Vocations',`Lord of the harvest, call and send holy priests, deacons, and religious, and strengthen married couples in their vocation. Give each of us the courage to answer your call. Amen.`],
n_church:['For the Church and the Pope',`Lord, watch over our Holy Father, our bishops, priests, and deacons. Give them wisdom, holiness, and courage, and keep your Church faithful to the Gospel. Amen.`],
n_sleep:['Before Sleep',`Lord, thank you for this day. Forgive what I did wrong, bless those I love, and keep me safe through the night. Into your hands I commend my spirit. Amen.`]});

joseph:`Ad te, beáte Ióseph, in tribulatióne nostra confúgimus, atque, imploráto Sponsæ tuæ sanctíssimæ auxílio, patrocínium quoque tuum fidénter exposcímus. Per eam, quǽsumus, quæ te cum immaculáta Vírgine Dei Genetríce coniúnxit, caritátem, perque patérnum, quo Púerum Iesum amplexátus es, amórem, supplíciter deprecámur, ut hǽreditatem, quam Iesus Christus acquísivit sánguine suo, benígno intúeare óculo, ac necessitátibus nostris tua virtúte et ope succúrras.

var STN=[
['Jesus Is Condemned to Death',`Pilate finds no guilt in Jesus, yet gives in to the crowd and sends him to be crucified (Mt 27:24-26). Jesus stays silent and accepts the sentence. Lord, when I am tempted to follow the crowd or to avoid the truth, give me courage.`],
['Jesus Takes Up His Cross',`Jesus receives the cross and carries it without complaint (Jn 19:17). Help me to accept my own crosses, large and small, from your hand, and to carry them with love.`],
['Jesus Falls the First Time',`Weakened by the scourging and the long night, Jesus falls under the weight of the cross (see Is 53:4-5). This station comes from Church tradition. When I fall into sin or discouragement, lift me up.`],
['Jesus Meets His Mother',`Mary meets her Son on the way, and the sword Simeon foretold pierces her heart (Lk 2:35). This station comes from Church tradition. Mary, help me to stay close to Jesus when it hurts.`],
['Simon of Cyrene Helps Jesus Carry the Cross',`The soldiers force Simon of Cyrene to carry the cross behind Jesus (Lk 23:26). Make me willing to help carry the burdens of others, even when it is inconvenient.`],
['Veronica Wipes the Face of Jesus',`According to tradition, a woman steps forward from the crowd to wipe the face of Jesus. Small acts of compassion are never lost (Mt 25:40). Let me see your face in those who suffer, and serve you in them.`],
['Jesus Falls the Second Time',`Again Jesus falls, and again he rises. This station comes from Church tradition. Give me perseverance when I fall again and again, and let me never stop returning to you.`],
['Jesus Meets the Women of Jerusalem',`Women weep as Jesus passes. He tells them: Do not weep for me, but for yourselves and your children (Lk 23:27-28). Teach me to be sorry for my sins and to pray for those I love.`],
['Jesus Falls the Third Time',`Exhausted, Jesus falls a third time and rises once more. This station comes from Church tradition. When I have nothing left, give me grace to get up and keep going with you.`],
['Jesus Is Stripped of His Garments',`The soldiers strip Jesus and divide his clothes among them (Jn 19:23-24). Strip me of my pride and my attachments, and help me honor the dignity of everyone who is humiliated.`],

Object.assign(P,{
dm1:['On the Large Bead',`Eternal Father, I offer you the Body and Blood, Soul and Divinity of your dearly beloved Son, our Lord Jesus Christ, in atonement for our sins and those of the whole world.`],
dm2:['On the Small Beads',`For the sake of his sorrowful Passion, have mercy on us and on the whole world.`],
dm3:['Holy God',`Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world.`],
dm4:['Closing Prayer',`Eternal God, in whom mercy is endless and the treasury of compassion inexhaustible, look kindly upon us and increase your mercy in us, that in difficult moments we might not despair nor become despondent, but with great confidence submit ourselves to your holy will, which is love and mercy itself. Amen.`],
ex1:['1. Remember God is Present',`Settle into stillness. Take a few slow breaths. Ask the Holy Spirit to help you see your day with God's eyes: not with judgment, but with love.`],
ex2:['2. Give Thanks',`Look back over your day and notice its gifts: people, small joys, moments of beauty, help you received. Thank God for each one.`],
ex3:['3. Review the Day',`Walk through your day hour by hour. Where did you feel close to God and to others? Where were you impatient, distracted, or unkind? Notice without excusing or condemning yourself.`],
ex4:['4. Ask Forgiveness',`Speak honestly to the Lord about what you regret, and receive his mercy. He is not surprised, and he is not leaving.`],
ex5:['5. Look to Tomorrow',`Ask for the grace you will need tomorrow. Name one thing you will try to do better, and entrust your sleep and your loved ones to God.`],
lc1:['1. Lectio: Read',`Choose a short Scripture passage, perhaps today's Gospel (the link is on the Rosary tab). Read it slowly, then read it again. Notice a word or phrase that stands out.`],
lc2:['2. Meditatio: Reflect',`Stay with that word or phrase. Turn it over gently. What is God saying through it? How does it touch your life today?`],
lc3:['3. Oratio: Respond',`Speak to God from your heart about what you have found: thanks, sorrow, a question, a request. Pray in your own words.`],
lc4:['4. Contemplatio: Rest',`Be still. Let go of words and simply rest in God's presence, as one rests with a trusted friend.`],
lc5:['5. Actio: Live It',`Choose one small way to live this word today. Then close with a Glory Be.`],
ad1:['Enter in Reverence',`Genuflect or bow, and take your place in silence. Remember that Jesus is truly present in the Blessed Sacrament. A holy hour is about an hour, but shorten it as you need.\n\nO Sacrament most holy, O Sacrament divine, all praise and all thanksgiving be every moment thine.`],
ad2:['Adore',`Simply be with him. You need no words. Look at him, and let him look at you.`],
ad3:['Give Thanks',`Thank Jesus for his gifts to you, especially the gift of himself in the Eucharist.`],
ad4:['Ask Mercy',`Bring your sins and weaknesses to him and ask for his mercy. You may pray the Act of Contrition.`],
ad5:['Intercede',`Pray for the people and needs you carry: your family, your friends, the sick, the Church, and the intentions on your list in the Me tab.`],
ad6:['Listen',`Open a Gospel or the Psalms and read a few verses slowly. Let the Lord speak to you.`],
ad7:['The Divine Praises',`Blessed be God.\nBlessed be his holy Name.\nBlessed be Jesus Christ, true God and true man.\nBlessed be the name of Jesus.\nBlessed be his most Sacred Heart.\nBlessed be his most Precious Blood.\nBlessed be Jesus in the most holy Sacrament of the Altar.\nBlessed be the Holy Spirit, the Paraclete.\nBlessed be the great Mother of God, Mary most holy.\nBlessed be her holy and Immaculate Conception.\nBlessed be her glorious Assumption.\nBlessed be the name of Mary, Virgin and Mother.\nBlessed be St. Joseph, her most chaste spouse.\nBlessed be God in his angels and in his saints.`]});

Object.assign(P,{
m_offer:['Morning Offering (short)',`O Jesus, through the heart of Mary, I offer you this day: all my thoughts, words and deeds, both joy and suffering.

Grant that all I do may be to your glory and for the salvation of souls. Amen.`],
m_eve:['Evening Prayer (simple)',`Lord God, I thank you for this day. Forgive me what I have done wrong, and be with me tonight. Amen.`],
m_mem:['Memorare (short form)',`Remember, O gracious Mary, that it has never been heard that anyone who fled to your protection was turned away.

I come to you, O Virgin of virgins, sinful and weak. Hear my prayer and help me. Amen.`],
m_jesus:['The Jesus Prayer',`Jesus Christ, Son of God, have mercy on me, a sinner.

(Or simply: Jesus, be with me.)`],
m_spirit:['Prayer to the Holy Spirit (short)',`Come, Holy Spirit, and fill our hearts with your grace. Kindle a light in the darkness within us and lead us to the truth. Amen.`],
m_str:['Prayer for Strength',`Lord God, give me strength to bear what comes my way. Help me to be faithful and reliable in all things. Amen.`],
m_work:['Prayer for My Work',`God, bless this work of mine. Grant that I may do it well and with honor, and that it may benefit others. Amen.`],
m_faith:['Prayer for Faith',`Lord God, strengthen my faith. Help me to believe in you, even when I do not understand everything. Do not let me stray from you. Amen.`],
m_hope:['Prayer for Hope',`God, give me hope when everything feels heavy. Remind me that you never let go of me. Amen.`],
m_love:['Prayer for Love',`Lord, teach me to love, not only those who love me, but also those I am angry with. Make my heart gentle. Amen.`],
m_prot:['Prayer for Protection',`Lord God, be with us today and tonight. Keep us from all evil, and lead us on the right path. Amen.`],
m_wday:['Prayer for the Workday',`God, I place this working day in your hands. Give me diligence, patience and strength. Help me to do a good job. Amen.`],
m_trb:['Prayer in Times of Trouble',`Lord, I do not know what to do. But I place my life in your hands. Help me to find the way forward. Amen.`],
m_peace:['Prayer for Peace (short)',`Lord God, give me peace in my heart. Take away fear and unrest. Let me rest in you. Amen.`],
m_temp:['Prayer Against Temptation',`God, help me when I am tempted. Give me strength to do what is right, even when it is hard. Amen.`],
m_sick:['Prayer for the Sick (short)',`Lord God, stretch out your hand to those who are sick. Heal them and strengthen them in their troubles. Amen.`],
m_dead:['Prayer for the Dead',`God, receive those who have departed from us. Give them eternal light and peace. Amen.`],
m_hum:['Prayer for Humility',`Lord, make me humble. Help me not to put myself first, but to serve others with love. Amen.`],
m_pat:['Prayer for Patience',`God, give me patience today, when everything goes slowly, and when people make me angry. Help me to stay calm. Amen.`]});
Object.assign(F,{
michael:`Mikael, høvuðseingil halgi,
verj okkum í stríði.
Ver vernd móti óndskapi og fellum djevulsins.
Lat hann kenna revsing Guds, tað biðja vit inniliga.
Og tú, prinsur himna herskaranna,
við Guds megi blaka til heljar Satan
og allar teir illu andar,
ið rekast um heimin leitandi eftir sálum at spilla.
Amen`,
m_offer:`O Jesus, gjøgnum Mariu hjarta,
offri eg tær hendan dagin:
allar mínar tankar, orð og gerðir,
bæði gleði og pínu.

Gev, at alt, eg geri, má verða til tín æru
og til frelsu fyri sálir. Amen.`,
m_eve:`Harra Gud, eg takki tær fyri hendan dagin.
Fyrigev mær tað, sum eg havi gjørt skeivt,
og ver við mær í nátt. Amen.`,
m_mem:`Minnist, o milda Maria,
at ongantíð hevur tað hoyrt til,
at nakar, sum flýðdi til tín verndar,
varð vístur burtur.

Eg komi til tín, o moyggjanna Moy,
syndugur og veikari.
Hoyr mína bøn og hjálp mær. Amen.`,
m_jesus:`Jesus Kristus, Guds Sonur,
miskunna mær syndara.

(Eller bara: Jesus, ver við mær)`,
m_spirit:`Kom, Heilagi Andi,
og fyll hjørtu okkara við tínari náði.
Kveik ljós í myrkrinum í okkum
og leið okkum til sannleikan. Amen.`,
m_str:`Harri Gud, gev mær styrki,
at eg kann bera tað, sum kemur á mín veg.
Hjálp mær at vera trúgvur og reiðiligur í
øllum. Amen.`,
m_work:`Gud, vælsignað hetta arbeiði mítt.
Gev, at eg geri tað væl og við heiðri,
og at tað gagnar øðrum. Amen.`,
m_faith:`Harri Gud, styrk trúgv mína.
Hjálp mær at trúgva á teg,
eisini tá eg ikki skilji alt.
Lat meg ikki hvørva frá tær. Amen.`,
m_hope:`Gud, gev mær vón,
tá alt kennist tungt.
Minst mær á,
at tú ongantíð sleppur mær. Amen.`,
m_love:`Harri, lær meg at elska,
ikki bara tey, sum elska meg,
men eisini tey, sum eg havi ilt við.
Ger hjarta mítt mildt. Amen.`,
m_prot:`Harri Gud, ver okkum í dag og í nátt.
Halt okkum frá øllum illum,
og leið okkum á rættan veg. Amen.`,
m_wday:`Gud, eg leggi hendan arbeiðsdagin í tínar hendur.
Gev mær dugnaskap, tol og styrki.
Hjálp mær at gera eitt gott arbeiði. Amen.`,
m_trb:`Harri, eg veit ikki, hvat eg skal gera.
Men eg seti lív mítt í tínar hendur.
Hjálp mær at finna vegin fram. Amen.`,
m_peace:`Harri Gud, gev mær frið í hjartanum.
Takam burtur ótta og órógv.
Lat meg hvíla í tær. Amen.`,
m_temp:`Gud, hjálp mær, tá eg verði freistaður.
Gev mær styrki at gera tað rætta,
eisini tá tað er ringt. Amen.`,
m_sick:`Harri Gud, røkk tíni hond út
til tey, sum eru sjúk.
Lækna tey og styrk tey í trupulleikum. Amen.`,
m_dead:`Gud, tak ímóti teimum, sum eru farin frá okkum.
Gev teimum ævigt ljós og frið. Amen.`,
m_hum:`Harri, ger meg eyðmjúkan.
Hjálp mær ikki at seta meg sjálvan fremst,
men at tæna øðrum við kærleika. Amen.`,
m_pat:`Gud, gev mær tol í dag.

og tá fólk gera meg illan.
Hjálp mær at halda meg róligan. Amen.`});

Object.assign(P,{
s_guid:['Prayer for Guidance',`Lord, show me the way I should walk. Do not let me walk the wrong way, but follow your will. Amen.`],
s_cross:['Prayer to Jesus on the Cross',`Jesus, you bore my suffering on the cross. Help me to bear my own. I place myself in your hands. Amen.`],
s_mary:['Prayer to Holy Mary (mother and protector)',`Holy Mary, Mother of God, take me and my family under your protection. Pray for us now and at the hour of our death. Amen.`],
s_joseph:['Prayer to St. Joseph (workers)',`Saint Joseph, protector of those who work, be with me in my work. Teach me patience, diligence and faithfulness. Help me to do my work well and with honor. Amen.`],
s_anthony:['Prayer to St. Anthony (lost things, help in trouble)',`Saint Anthony, faithful servant of God, help me to find what is lost, and guide me in what I do not understand. Pray for me to God. Amen.`],
s_fran1:['Prayer to St. Francis of Assisi',`Saint Francis, teach me to be gentle, humble and peaceful. Help me to see God in all creation. Amen.`],
s_fran2:['St. Francis of Assisi: Instrument of Peace',`Saint Francis, teach me to be an instrument of peace. Where there is hatred, let me bring love; where there is discord, let me bring harmony. Amen.`],
s_patron:['Prayer to a Patron Saint (personal)',`Saint (name), you who are a friend of God in heaven, pray for me to our Lord. Be with me in my life and work. Amen.`],
s_teresa:['St. Teresa of Avila (prayer)',`Saint Teresa, teach me to seek God in prayer. Strengthen my soul, so that I do not give up, but hold fast to faith. Amen.`],
s_magd:['St. Mary Magdalene',`Saint Mary Magdalene, faithful witness to the resurrection of the Lord, pray for us, that we may turn away from sin and stay close to Christ. Amen.`],
s_luke:['St. Luke the Evangelist',`Saint Luke, faithful physician and evangelist, pray for us, that we may come to know Christ better through his word. Amen.`],
s_cath:['St. Catherine of Siena',`Saint Catherine, give me courage to stand for the truth, even when it is difficult. Help me to live rightly and purely. Amen.`],
s_john:['St. John the Evangelist',`Saint John, friend of Jesus and disciple of love, teach us to love God and one another with a pure heart. Amen.`],
s_seb:['St. Sebastian',`Saint Sebastian, strong witness in times of distress, strengthen us in adversity, so that we do not lose courage. Amen.`],
s_agatha:['St. Agatha',`Saint Agatha, faithful witness of God, be with those who struggle, and help us to be faithful in times of trial. Amen.`],
s_martin:['St. Martin of Tours',`Saint Martin, who shared his cloak with the poor man, teach us to be good and generous. Amen.`],
s_ben:['St. Benedict (prayer)',`Saint Benedict, father of prayer and work, teach us discipline, peace and joy in work. Amen.`],
s_pio:['St. Pio of Pietrelcina (Padre Pio)',`Saint Pio, faithful priest and man of prayer, teach us to love prayer and sacrifice. Help us to bear our crosses with patience. Amen.`],
s_therese:['St. Therese of Lisieux (the Little Flower)',`Saint Therese, teach me to do small things with great love. Help me to be faithful in little things, so that I can love God in everyday life. Amen.`],
s_carlo:['Prayer to Carlo Acutis',`Saint Carlo Acutis, teach us to use the internet rightly, so that it leads us to God and not away from him. Pray for us. Amen.`]});
Object.assign(F,{
s_guid:`Harri, vís mær tann veg, eg eigi at ganga.
Lat meg ikki ganga skeivan veg,
men fylgja tínum vilja. Amen.`,
s_cross:`Jesus, tú barst mína pínu á krossinum.
Hjálp mær at bera mína egnu.

s_mary:`Heilaga Maria, Guds móðir,
tak undir tíni verju meg og mína familju.
Bið fyri okkum nú og í deyðastund okkara. Amen.`,
s_joseph:`Heilagi Jósef, verndari av teimum arbeiðandi,
ver tú hjá mær í arbeiði mínum.

Hjálp mær at gera arbeiðið væl og við heiðri. Amen.`,
s_anthony:`Heilagi Antonius, trúfastur tænari Guds,

og leið meg í tað, sum eg ikki skilji.
Bið fyri mær hjá Gudi. Amen.`,
s_fran1:`Heilagi Fransiskus,
lær meg at vera mildur, eyðmjúkur og friðsamur.
Hjálp mær at síggja Gud í øllum skapanum. Amen.`,
s_fran2:`Heilagi Fransiskus,
lær meg at vera amboð fyri frið.
Har hat er, lat meg seta kærleika,
har ósemja er, lat meg seta semju. Amen.`,
s_patron:`Heilagi (navn),

bið fyri mær hjá Harra okkara.
Ver hjá mær í lívi og arbeiði mínum. Amen.`,
s_teresa:`Heilaga Teresia,
lær meg at søkja Gud í bøn.

so eg ikki gevist,
men haldi fast við trúgv. Amen.`,
s_magd:`Heilaga Maria Magdalena,

bið fyri okkum,
so vit venda okkum frá synd
og halda okkum nær Kristusi. Amen.`,
s_luke:`Heilagi Lukas,
trúgvi lækni og evangelistur,
bið fyri okkum,
so vit læra Kristus betur at kenna
gjøgnum orð hansara. Amen.`,
s_cath:`Heilaga Katarina,
gev mær dirvi at standa fyri sannleikanum,
eisini tá tað er trupult.
Hjálp mær at liva rætt og reint. Amen.`,
s_john:`Heilagi Jóhannes,
vinur Jesu og lærusveinur kærleika,
lær okkum at elska Gud
og hvør annan við reinum hjarta. Amen.`,
s_seb:`Heilagi Sebastian,
sterki vitni í trongdum,
styrk okkum í mótgangi,
so vit ikki missa mót. Amen.`,
s_agatha:`Heilaga Agata,
trúfasta vitni Guds,
ver hjá teimum, sum stríðast,
og hjálp okkum at vera trúgv í royndum. Amen.`,
s_martin:`Heilagi Martin,
sum deildi kápuna við hin fátæka,
lær okkum at vera góðir og gavmildir. Amen.`,
s_ben:`Heilagi Benedikt,
faðir av bøn og arbeiði,
lær okkum disiplin, frið og arbeiðsgleði. Amen.`,
s_pio:`Heilagi Pio,
trufasti prestur og bønarmaður,
lær okkum at elska bøn og offur.
Hjálp okkum at bera okkara krossar við tol. Amen.`,
s_therese:`Heilaga Teresia,
lær meg at gera smá ting við stórum kærleika.
Hjálp mær at vera trúfastur í tí lítla,
so eg kann elska Gud í gerandisdegnum. Amen.`,
s_carlo:`Heilagi Carlo Acutis,
lær okkum at brúka internetið rætt,
so tað leiðir okkum til Gud
og ikki burtur frá honum.

Bið fyri okkum. Amen.`});

P.nicene=['Nicene Creed',`I believe in one God,
the Father almighty,
maker of heaven and earth,
and of all things visible and invisible.

And in one Lord Jesus Christ,
the only-begotten Son of God,
born of the Father before all ages.
God of God, light of light, true God of true God,
begotten, not made, consubstantial with the Father;
by whom all things were made.
Who for us men and for our salvation came down from heaven.
And became incarnate by the Holy Ghost of the Virgin Mary,
and was made man.

He was also crucified for us,
suffered under Pontius Pilate, and was buried.
And on the third day he rose again, according to the Scriptures.
And ascended into heaven,
and sits at the right hand of the Father.
And he shall come again with glory
to judge the living and the dead;
of whose kingdom there shall be no end.

And in the Holy Ghost, the Lord and giver of life,
who proceeds from the Father and the Son;
who together with the Father and the Son
is adored and glorified;
who spoke by the prophets.
And one holy, catholic, and apostolic Church.
I confess one baptism for the remission of sins.
And I look for the resurrection of the dead,
and the life of the world to come. Amen.`];
L.nicene=`Credo in unum Deum,
Patrem omnipótentem,
factorem cǽli et terrǽ,
visibílium ómnium et invisibílium.

Et in unum Dóminum Iesum Christum,
Fílium Dei unigénitum,
et ex Patre natum ante ómnia sǽcula.
Deum de Deo, lumen de lúmine, Deum verum de Deo vero,
génitum, non factum, consubstantiálem Patri:
per quem ómnia facta sunt.
Qui propter nos hómines et propter nostram salútem
descéndit de cǽlis.
Et incarnátus est de Spíritu Sancto ex María Vírgine:
et homo factus est.

Crucifíxus étiam pro nobis sub Póntio Piláto;
passus, et sepúltus est.
Et resurréxit tértia die, secúndum Scripturás.
Et ascéndit in cǽlum:
sedet ad déxteram Patris.
Et itérum venturús est cum glória
iudicáre vivos et mórtuos:
cuius regni non erit finis.

Et in Spíritum Sanctum, Dóminum et vivificántem:
qui ex Patre Filióque procédit.
Qui cum Patre et Fílio simul adorátur et conglorificátur:
qui locútus est per Prophetás.
Et unam, sanctam, cathólicam et apostólicam Ecclésiam.
Confíteor unum baptísma in remissiónem peccatórum.
Et exspécto resurrectiónem mortuórum,
et vitam venturí sǽculi. Amen.`;
P.athanasian=['Athanasian Creed',`Whosoever will be saved, before all things it is necessary that he hold the Catholic Faith. Which Faith except every one do keep whole and undefiled, without doubt he shall perish everlastingly.

And the Catholic Faith is this: That we worship one God in Trinity, and Trinity in Unity; neither confounding the Persons, nor dividing the Substance. For there is one Person of the Father, another of the Son, and another of the Holy Ghost. But the Godhead of the Father, of the Son, and of the Holy Ghost, is all one, the Glory equal, the Majesty co-eternal.

Such as the Father is, such is the Son, and such is the Holy Ghost. The Father uncreate, the Son uncreate, and the Holy Ghost uncreate. The Father incomprehensible, the Son incomprehensible, and the Holy Ghost incomprehensible. The Father eternal, the Son eternal, and the Holy Ghost eternal. And yet they are not three eternals, but one eternal. As also there are not three incomprehensibles, nor three uncreated, but one uncreated, and one incomprehensible.

So likewise the Father is Almighty, the Son Almighty, and the Holy Ghost Almighty. And yet they are not three Almighties, but one Almighty. So the Father is God, the Son is God, and the Holy Ghost is God. And yet they are not three Gods, but one God. So likewise the Father is Lord, the Son Lord, and the Holy Ghost Lord. And yet not three Lords, but one Lord.

For like as we are compelled by the Christian verity to acknowledge every Person by himself to be God and Lord, so are we forbidden by the Catholic Religion to say, There be three Gods, or three Lords.

The Father is made of none, neither created, nor begotten. The Son is of the Father alone; not made, nor created, but begotten. The Holy Ghost is of the Father and of the Son; neither made, nor created, nor begotten, but proceeding. So there is one Father, not three Fathers; one Son, not three Sons; one Holy Ghost, not three Holy Ghosts.

And in this Trinity none is afore, or after another; none is greater, or less than another. But the whole three Persons are co-eternal, and co-equal. So that in all things, as is aforesaid, the Unity in Trinity, and the Trinity in Unity, is to be worshipped. He therefore that will be saved, must thus think of the Trinity.

Furthermore it is necessary to everlasting salvation, that he also believe rightly the Incarnation of our Lord Jesus Christ. For the right Faith is, that we believe and confess, that our Lord Jesus Christ, the Son of God, is God and Man; God, of the Substance of the Father, begotten before the worlds; and Man, of the Substance of his Mother, born in the world; perfect God, and perfect Man, of a reasonable soul and human flesh subsisting; equal to the Father, as touching his Godhead; and inferior to the Father as touching his Manhood.

Who although he be God and Man, yet he is not two, but one Christ; one, not by conversion of the Godhead into flesh, but by taking of the Manhood into God; one altogether, not by confusion of Substance, but by unity of Person. For as the reasonable soul and flesh is one man, so God and Man is one Christ; who suffered for our salvation; descended into hell; rose again the third day from the dead. He ascended into heaven, he sits on the right hand of the Father, God Almighty; from whence he shall come to judge the quick and the dead.

At whose coming all men shall rise again with their bodies, and shall give account for their own works. And they that have done good shall go into life everlasting; and they that have done evil, into everlasting fire.

This is the Catholic Faith; which except a man believe faithfully, he cannot be saved.`];

e_paul:['Prayer to St. Paul the Apostle',`Holy Apostle Paul, chosen vessel and teacher of the nations, you whom Christ turned around on the road to Damascus and who gave your life for the Gospel, pray for us. Obtain for us a heart that is turned to Christ, courage to proclaim the faith, and perseverance in trials. Teach us to say with you that for us to live is Christ. Pray for the Church, and for all who do not yet know him. Amen.`],
e_tax:['Prayer to the Holy Taxiarchs, Michael and Gabriel',`Holy Archangels Michael and Gabriel, commanders of the heavenly hosts and servants of the Most High, intercede for us. Michael, defend us in the struggle against evil. Gabriel, messenger of good news, help us to hear the word of God and to answer as Mary did. Guard us from dangers of body and soul, strengthen the Church, and lead us in the way of peace. Amen.`],
e_mich:['Prayer to St. Michael the Archangel (intercession)',`Holy Archangel Michael, commander of the heavenly hosts, stand beside us in every trial. Protect your people, comfort the afflicted, and defend the Church. Obtain for us courage to resist evil and fidelity to God's will all our days. Amen.`],
e_gab:['Prayer to St. Gabriel the Archangel',`Holy Archangel Gabriel, who announced to Mary the coming of the Savior, pray for us. Open our ears to the word of God, and give us the humility to say yes to his will. Be a messenger of peace to our families and to all who wait in hope. Amen.`],
e_hier:['Prayer to the Three Hierarchs',`Holy Hierarchs Basil the Great, Gregory the Theologian, and John Chrysostom, shepherds and teachers of the Church, lights of the world, intercede for us. Teach us to love the truth of the Gospel, to seek wisdom with humility, and to serve the poor and the Church with all our hearts. Pray that we may keep the faith whole, and that all who learn and teach may come to know Christ. Amen.`],
e_basil:['St. Basil the Great',`Saint Basil the Great, shepherd of the poor and defender of the faith, pray for us. Teach us to care for those in need, to pray with constancy, and to hold fast to the faith of the Church. Amen.`],
e_greg:['St. Gregory the Theologian',`Saint Gregory the Theologian, who spoke so well of the Holy Trinity, pray for us. Open our minds and hearts to know the Father, the Son, and the Holy Spirit, and give us words of truth and peace. Amen.`],
e_chrys:['St. John Chrysostom',`Saint John Chrysostom, golden-mouthed preacher of the Gospel, pray for us. Give us a love of Scripture, courage to speak the truth, and generous hearts toward the poor. Amen.`]});

DV.push(
['Welcome',`You do not need to believe everything yet, or know the right words. Prayer is simply talking and listening to God. You can start with one honest sentence, such as: God, if you are there, help me.

This app is a companion for people at every stage, whether you have prayed all your life or are just curious. Nothing here is a test, and nobody is keeping score.`],
['How to Pray in Five Minutes',`1. Get quiet for a moment. Put your phone on silent and take three slow breaths.
2. Make the Sign of the Cross: In the name of the Father, and of the Son, and of the Holy Spirit.
3. Talk to God honestly, in your own words. Say thank you for something, say sorry for something, and ask for something.
4. Pray the Our Father slowly (you can find it in the Prayers tab).
5. Sit in silence for a minute. You do not have to feel anything.
6. Finish with the Sign of the Cross.

Try this once a day for a week and see what changes.`],
['What Catholics Believe, in Short',`Catholics believe that:

- There is one God, who is a communion of three Persons: Father, Son, and Holy Spirit.
- God made everything out of love, and made each person for friendship with him.
- Sin, in us and in the world, broke that friendship, and God did not leave us alone.
- Jesus Christ is God made man. He taught, healed, died on the cross, and rose from the dead to forgive sins and open the way to eternal life.
- Jesus founded the Church, and gave it the Bible, the sacraments, and teachers to carry on his work.
- God comes to us through the seven sacraments, above all the Eucharist, where Catholics believe Jesus is truly present.
- We are called to love God and our neighbor, especially the poor and suffering.
- Death is not the end: Christians hope in the resurrection of the body and life everlasting.

The Apostles' Creed (in the Prayers tab) puts these beliefs in a few lines.`],
['Your First Rosary',`The Rosary is a prayer made of short, repeated prayers, while you think about the life of Jesus. It is prayed with a string of beads, but you can also just use the Rosary tab in this app.

How it works:
- It has five “decades.” Each decade is one Our Father, ten Hail Marys, and one Glory Be.
- While praying each decade, you picture one scene from the life of Jesus and Mary, such as the Nativity or the Crucifixion.
- The repeating words are like a quiet background, so your mind is free to think about the scene.

To try it: open the Rosary tab and tap Next to move through each prayer. One decade is a good start; it takes about two minutes. You do not need to be Catholic to pray it, and you do not need to feel anything special.`],
['Questions People Often Ask',`Do I have to be Catholic to pray these prayers?
No. Anyone can pray them. Prayer is open to everyone.

Is it okay to have doubts?
Yes. Many saints struggled with doubt. Questions are a normal part of faith, and the Church has centuries of answers worth exploring.

What if I feel nothing when I pray?
That is common. Prayer is not mainly about feelings; it is about showing up, the way you keep in touch with a friend.

Why do Catholics pray to Mary and the saints?
Catholics ask them to pray for us, the same way you would ask a friend or family member to pray for you. Worship belongs to God alone.

Who can I talk to?
A local parish priest or parish office is glad to answer questions, with no pressure. Many parishes also run a gentle introductory course (often called RCIA) for people who are curious.`],
['Next Steps',`A few simple ways to take the next step:

1. Keep a small daily prayer going, even two minutes.
2. Read a Gospel slowly, starting with Mark (the shortest) or Luke.
3. Visit a Catholic church for Mass. Visitors are welcome, and the Mass guide in this app explains what to expect.
4. Ask a priest or a Catholic friend your questions.
5. Write down your thoughts in the Prayer Journal (Me tab).

There is no hurry. Take it one step at a time.`],
['What Happens at Mass',`Mass has two main parts, with an opening before them and a closing after.

Introductory Rites: The priest enters with the servers. Everyone makes the Sign of the Cross and asks for God's mercy.

Liturgy of the Word: Readings from Scripture: usually an Old Testament reading, a psalm, a letter from the New Testament, and the Gospel. The priest or deacon gives a homily, a short talk. Then everyone says the Creed and prays for the needs of the world.

Liturgy of the Eucharist: Gifts of bread and wine are brought forward. The priest prays the Eucharistic Prayer, and Catholics believe the bread and wine become the Body and Blood of Christ. Everyone prays the Our Father and exchanges a sign of peace.

Communion: Catholics who are prepared receive Communion.

Concluding Rites: A blessing and a dismissal: Go forth, the Mass is ended. Mass usually lasts about an hour.`],
['When to Sit, Stand, and Kneel',`Customs vary a little by country and parish, so simply watch what others do. In general:

Stand: when the priest enters and leaves; for the Gospel; for the Creed and the prayers of the faithful; and for the Our Father.

Sit: for the readings before the Gospel, for the homily, and while the gifts are brought forward.

Kneel: during the Eucharistic Prayer (many places begin after the Holy, Holy, Holy), and in many places after the Lamb of God, until Communion. Anyone who cannot kneel may sit.

Nobody expects you to do any of this perfectly.`],
['If You Are Visiting',`Everyone is welcome at Mass, whether Catholic or not.

- Arrive a few minutes early and sit wherever you like.
- Dress neatly. There is no strict dress code, but many people dress modestly.
- You do not have to say the responses or make any gestures. Stand, sit, and listen as you are comfortable.
- A collection is taken up during the offertory. Giving is voluntary, and visitors are not expected to give.
- Silence before and after Mass is normal. People are often praying.
- Turn your phone off or to silent.`],
['Communion',`The Eucharist is the center of Catholic worship. Catholics believe that Jesus is truly present in the consecrated bread and wine.

Because of this, the Church asks that Catholics who receive be in a state of grace (they go to Confession first if they are aware of a serious sin) and fast for one hour beforehand from food and drink (water and medicine are fine).

If you are not Catholic, or are not able to receive, you are still welcome to join the Communion line. Many parishes invite you to cross your arms over your chest, and the priest will usually give a short blessing instead. You may also stay in your seat and pray. No one will judge you either way.`]);

var DOX='\n\nGlory be to the Father, and to the Son, and to the Holy Spirit;\nas it was in the beginning, is now, and ever shall be. Amen.';
function psl(n,t,txt){P['ps'+n]=[t,txt+DOX]}
psl(95,'Psalm 95 (Venite), selected verses',`O come, let us sing unto the LORD:\nlet us make a joyful noise to the rock of our salvation.\nLet us come before his presence with thanksgiving,\nand make a joyful noise unto him with psalms.\nFor the LORD is a great God, and a great King above all gods.\nIn his hand are the deep places of the earth:\nthe strength of the hills is his also.\nThe sea is his, and he made it:\nand his hands formed the dry land.\nO come, let us worship and bow down:\nlet us kneel before the LORD our maker.\nFor he is our God;\nand we are the people of his pasture, and the sheep of his hand.\nTo day if ye will hear his voice, harden not your heart.`);
psl(100,'Psalm 100 (Jubilate)',`Make a joyful noise unto the LORD, all ye lands.\nServe the LORD with gladness: come before his presence with singing.\nKnow ye that the LORD he is God:\nit is he that hath made us, and not we ourselves;\nwe are his people, and the sheep of his pasture.\nEnter into his gates with thanksgiving, and into his courts with praise:\nbe thankful unto him, and bless his name.\nFor the LORD is good; his mercy is everlasting;\nand his truth endureth to all generations.`);
psl(117,'Psalm 117 (Laudate)',`O praise the LORD, all ye nations: praise him, all ye people.\nFor his merciful kindness is great toward us:\nand the truth of the LORD endureth for ever.\nPraise ye the LORD.`);
psl(150,'Psalm 150',`Praise ye the LORD.\nPraise God in his sanctuary: praise him in the firmament of his power.\nPraise him for his mighty acts: praise him according to his excellent greatness.\nPraise him with the sound of the trumpet: praise him with the psaltery and harp.\nPraise him with the timbrel and dance: praise him with stringed instruments and organs.\nPraise him upon the loud cymbals: praise him upon the high sounding cymbals.\nLet every thing that hath breath praise the LORD.\nPraise ye the LORD.`);
psl(148,'Psalm 148, selected verses',`Praise ye the LORD. Praise ye the LORD from the heavens: praise him in the heights.\nPraise ye him, all his angels: praise ye him, all his hosts.\nPraise ye him, sun and moon: praise him, all ye stars of light.\nPraise him, ye heavens of heavens, and ye waters that be above the heavens.\nLet them praise the name of the LORD: for he commanded, and they were created.\nPraise the LORD from the earth, ye dragons, and all deeps:\nfire, and hail; snow, and vapours; stormy wind fulfilling his word:\nmountains, and all hills; fruitful trees, and all cedars:\nbeasts, and all cattle; creeping things, and flying fowl:\nkings of the earth, and all people; princes, and all judges of the earth:\nboth young men, and maidens; old men, and children:\nlet them praise the name of the LORD:\nfor his name alone is excellent; his glory is above the earth and heaven.`);
psl(63,'Psalm 63, verses 1-8',`O God, thou art my God; early will I seek thee:\nmy soul thirsteth for thee, my flesh longeth for thee\nin a dry and thirsty land, where no water is;\nto see thy power and thy glory, so as I have seen thee in the sanctuary.\nBecause thy lovingkindness is better than life, my lips shall praise thee.\nThus will I bless thee while I live: I will lift up my hands in thy name.\nMy soul shall be satisfied as with marrow and fatness;\nand my mouth shall praise thee with joyful lips:\nwhen I remember thee upon my bed, and meditate on thee in the night watches.\nBecause thou hast been my help, therefore in the shadow of thy wings will I rejoice.\nMy soul followeth hard after thee: thy right hand upholdeth me.`);
psl(51,'Psalm 51 (Miserere), selected verses',`Have mercy upon me, O God, according to thy lovingkindness:\naccording unto the multitude of thy tender mercies blot out my transgressions.\nWash me throughly from mine iniquity, and cleanse me from my sin.\nFor I acknowledge my transgressions: and my sin is ever before me.\nAgainst thee, thee only, have I sinned, and done this evil in thy sight.\nBehold, thou desirest truth in the inward parts:\nand in the hidden part thou shalt make me to know wisdom.\nPurge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.\nMake me to hear joy and gladness; that the bones which thou hast broken may rejoice.\nHide thy face from my sins, and blot out all mine iniquities.\nCreate in me a clean heart, O God; and renew a right spirit within me.\nCast me not away from thy presence; and take not thy holy spirit from me.\nRestore unto me the joy of thy salvation; and uphold me with thy free spirit.\nO Lord, open thou my lips; and my mouth shall shew forth thy praise.\nThe sacrifices of God are a broken spirit:\na broken and a contrite heart, O God, thou wilt not despise.`);
psl(23,'Psalm 23',`The LORD is my shepherd; I shall not want.\nHe maketh me to lie down in green pastures: he leadeth me beside the still waters.\nHe restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.\nYea, though I walk through the valley of the shadow of death, I will fear no evil:\nfor thou art with me; thy rod and thy staff they comfort me.\nThou preparest a table before me in the presence of mine enemies:\nthou anointest my head with oil; my cup runneth over.\nSurely goodness and mercy shall follow me all the days of my life:\nand I will dwell in the house of the LORD for ever.`);
psl(121,'Psalm 121',`I will lift up mine eyes unto the hills, from whence cometh my help.\nMy help cometh from the LORD, which made heaven and earth.\nHe will not suffer thy foot to be moved: he that keepeth thee will not slumber.\nBehold, he that keepeth Israel shall neither slumber nor sleep.\nThe LORD is thy keeper: the LORD is thy shade upon thy right hand.\nThe sun shall not smite thee by day, nor the moon by night.\nThe LORD shall preserve thee from all evil: he shall preserve thy soul.\nThe LORD shall preserve thy going out and thy coming in\nfrom this time forth, and even for evermore.`);
psl(130,'Psalm 130 (De profundis)',`Out of the depths have I cried unto thee, O LORD.\nLord, hear my voice: let thine ears be attentive to the voice of my supplications.\nIf thou, LORD, shouldest mark iniquities, O Lord, who shall stand?\nBut there is forgiveness with thee, that thou mayest be feared.\nI wait for the LORD, my soul doth wait, and in his word do I hope.\nMy soul waiteth for the Lord more than they that watch for the morning:\nI say, more than they that watch for the morning.\nLet Israel hope in the LORD: for with the LORD there is mercy,\nand with him is plenteous redemption.\nAnd he shall redeem Israel from all his iniquities.`);
psl(141,'Psalm 141, verses 1-4',`LORD, I cry unto thee: make haste unto me; give ear unto my voice, when I cry unto thee.\nLet my prayer be set forth before thee as incense;\nand the lifting up of my hands as the evening sacrifice.\nSet a watch, O LORD, before my mouth; keep the door of my lips.\nIncline not my heart to any evil thing.`);
psl(110,'Psalm 110, verses 1-4',`The LORD said unto my Lord, Sit thou at my right hand,\nuntil I make thine enemies thy footstool.\nThe LORD shall send the rod of thy strength out of Zion:\nrule thou in the midst of thine enemies.\nThy people shall be willing in the day of thy power,\nin the beauties of holiness from the womb of the morning:\nthou hast the dew of thy youth.\nThe LORD hath sworn, and will not repent,\nThou art a priest for ever after the order of Melchizedek.`);
psl(4,'Psalm 4, selected verses',`Hear me when I call, O God of my righteousness:\nthou hast enlarged me when I was in distress; have mercy upon me, and hear my prayer.\nBut know that the LORD hath set apart him that is godly for himself:\nthe LORD will hear when I call unto him.\nStand in awe, and sin not: commune with your own heart upon your bed, and be still.\nOffer the sacrifices of righteousness, and put your trust in the LORD.\nLORD, lift thou up the light of thy countenance upon us.\nThou hast put gladness in my heart.\nI will both lay me down in peace, and sleep:\nfor thou, LORD, only makest me dwell in safety.`);
psl(91,'Psalm 91, selected verses',`He that dwelleth in the secret place of the most High\nshall abide under the shadow of the Almighty.\nI will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.\nSurely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.\nHe shall cover thee with his feathers, and under his wings shalt thou trust:\nhis truth shall be thy shield and buckler.\nThou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;\nnor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday.\nFor he shall give his angels charge over thee, to keep thee in all thy ways.\nThey shall bear thee up in their hands, lest thou dash thy foot against a stone.\nBecause he hath set his love upon me, therefore will I deliver him:\nI will set him on high, because he hath known my name.\nHe shall call upon me, and I will answer him: I will be with him in trouble;\nI will deliver him, and honour him.\nWith long life will I satisfy him, and shew him my salvation.`);
psl(134,'Psalm 134',`Behold, bless ye the LORD, all ye servants of the LORD,\nwhich by night stand in the house of the LORD.\nLift up your hands in the sanctuary, and bless the LORD.\nThe LORD that made heaven and earth bless thee out of Zion.`);
Object.assign(P,{
lips:['Opening of the Day',`Lord, open my lips.\nAnd my mouth will proclaim your praise.`],
vc:['Hymn: Veni Creator Spiritus',`Come, Holy Ghost, our souls inspire,\nAnd lighten with celestial fire;\nThou the anointing Spirit art,\nWho dost thy sevenfold gifts impart.\nThy blessed unction from above\nIs comfort, life, and fire of love.\nEnable with perpetual light\nThe dullness of our blinded sight.\nAnoint and cheer our soiled face\nWith the abundance of thy grace.\nKeep far our foes, give peace at home;\nWhere thou art guide, no ill can come.\nTeach us to know the Father, Son,\nAnd thee, of both, to be but One;\nThat through the ages all along\nThis may be our endless song:\nPraise to thy eternal merit,\nFather, Son, and Holy Spirit. Amen.`],
phos:['Evening Hymn: Hail, Gladdening Light',`Hail, gladdening Light, of his pure glory poured,\nWho is the immortal Father, heavenly, blest,\nHoliest of Holies, Jesus Christ our Lord!\nNow we are come to the sun's hour of rest;\nThe lights of evening round us shine;\nWe hymn the Father, Son, and Holy Spirit divine.\nWorthiest art thou at all times to be sung\nWith undefiled tongue,\nSon of our God, giver of life, alone:\nTherefore in all the world thy glories, Lord, they own.`],
teluc:['Night Hymn: Te lucis ante terminum',`Before the ending of the day,\nCreator of the world, we pray\nThat thou, with wonted favour, wouldst\nBe our protector and our guard.\nFrom all ill dreams defend our eyes,\nFrom nightly fears and fantasies;\nTread underfoot our ghostly foe,\nThat no pollution we may know.\nO Father, that we ask be done\nThrough Jesus Christ, thine only Son;\nWho, with the Holy Ghost and thee,\nDoth live and reign eternally. Amen.`],
exam:['Examination of Conscience',`Take a quiet moment to look back over your day. Thank God for what was good, and notice where you fell short of love. Then ask for his mercy and pray the Act of Contrition.`],
shr_n:['Short Reading (1 Peter 5:8-9)',`Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour: whom resist stedfast in the faith.\n\n1 Peter 5:8-9 (King James Version)`],
conc_m:['Concluding Prayer',`Direct, we beseech thee, O Lord, our actions by thy holy inspirations, and carry them on by thy gracious assistance; that every prayer and work of ours may begin always from thee, and by thee be happily ended. Through Christ our Lord. Amen.`],
conc_d:['Concluding Prayer',`Lord, stay with me through the rest of this day. Bless my work, keep me from sin, and help me to do all for your glory. Amen.`],
conc_e:['Concluding Prayer',`Lighten our darkness, we beseech thee, O Lord; and by thy great mercy defend us from all perils and dangers of this night; for the love of thy only Son, our Saviour, Jesus Christ. Amen.`],
conc_n:['Concluding Prayer',`Visit, we beseech thee, O Lord, this dwelling, and drive far from it all snares of the enemy; let thy holy angels dwell herein to preserve us in peace; and let thy blessing be always upon us. Through Christ our Lord. Amen.`],
bless_m:['Dismissal',`Let us bless the Lord.\nThanks be to God.`],
bless_n:['Night Blessing',`May the Lord almighty grant us a quiet night and a perfect end. Amen.`]});
Object.assign(L,{
lips:`Dómine, lábia mea apéries.\nEt os meum annuntiábit laudem tuam.`,
vc:`Veni, Creator Spíritus,\nmentes tuórum vísita,\nimple superna grátia\nquæ tu creasti péctora.\nQui díceris Paráclitus,\naltissimi donum Dei,\nfons vivus, ignis, carítas,\net spiritalis unctio.\nTu septifórmis múnere,\ndigitus paternæ déxteræ,\ntu rite promissum Patris\nsermone ditans gúttura.\nAccende lumen sénsibus,\ninfúnde amorem córdibus,\ninfírma nostri córporis\nvirtúte firmans pérpeti.\nHostem repéllas lóngius\npacemque dones prótinus;\nductore sic te prǽvio\nvitémus omne nóxium.\nPer te sciámus da Patrem\nnoscámus atque Fílium,\nteque utríusque Spíritum\ncredámus omni témpore.\nDeo Patri sit glória\net Fílio, qui a mórtuis\nsurréxit, ac Paráclito,\nin sǽculorum sǽcula. Amen.`,
teluc:`Te lucis ante términum,\nrerum Creator, póscimus,\nut pro tua cleméntia\nsis prǽsul et custodia.\nProcul recedant sómnia\net noctium phantasmáta;\nhostemque nostrum cómprime,\nne polluántur córpora.\nPrǽsta, Pater piíssime,\nPatrique compar Unice,\ncum Spíritu Paráclito\nregnans per omne sǽculum. Amen.`,
conc_m:`Actiones nostras, quǽsumus, Dómine, aspirándo prǽveni et adiuvándo prósequere: ut cuncta nostra oratió et operatió a te semper incipiat et per te cœpta finiatur. Per Christum Dóminum nostrum. Amen.`,
conc_n:`Visita, quǽsumus, Dómine, habitatiónem istam, et omnes insídias inimíci ab ea longe repélle: Angeli tui sancti habítent in ea, qui nos in pace custódiant; et benedictió tua sit super nos semper. Per Christum Dóminum nostrum. Amen.`,
bless_m:`Benedicámus Dómino.\nDeo grátias.`,
bless_n:`Noctem quiétam et finem perféctum concédat nobis Dóminus omnipótens. Amen.`});
