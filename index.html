CAL['07-29']='St. Olaf of Norway';
var SB={
'01-01':['m',`On the eighth day of Christmas the Church honors Mary as the Mother of God (Theotokos), a title affirmed at the Council of Ephesus in 431. It is also the World Day of Peace.`],
'01-06':['l',`Wise men from the East follow a star to Bethlehem and worship the Christ Child (Matthew 2:1-12). The feast shows that Jesus came for every nation.`],
'01-17':['s',`Anthony of Egypt (c. 251-356) gave away his inheritance and lived for decades as a hermit in the desert. He is honored as the father of monks.`],
'01-21':['s',`Agnes was a young Roman martyr who died around 304 rather than give up her consecration to Christ. Her name is in the First Eucharistic Prayer.`],
'01-24':['s',`Francis de Sales (1567-1622), Bishop of Geneva, taught that holiness is for everyone, not only priests and religious. His Introduction to the Devout Life is still widely read. He is patron of writers and journalists.`],
'01-25':['s',`Saul persecuted the first Christians until the risen Jesus met him on the road to Damascus (Acts 9). He became Paul, the apostle to the nations, and wrote much of the New Testament.`,'e_paul','Saint Paul, pray for us.'],
'01-28':['s',`Thomas Aquinas (1225-1274), a Dominican friar, is one of the Church's greatest theologians. His Summa Theologiae shows how faith and reason belong together. He is patron of students and schools.`],
'01-31':['s',`John Bosco (1815-1888), a priest in Turin, cared for poor and abandoned boys through schools, workshops, and play. He founded the Salesians.`],
'02-02':['l',`Forty days after his birth, Mary and Joseph present Jesus in the Temple, where Simeon and Anna recognize him (Luke 2:22-38). Candles are blessed today, so it is also called Candlemas.`,'nunc'],
'02-03':['s',`Blaise was a bishop and martyr in Armenia in the 300s. By tradition he saved a boy who was choking on a fish bone, so throats are blessed on his feast.`],
'02-05':['s',`Agatha was a young martyr of Sicily in the 200s who stayed faithful to Christ under torture. She is patron of those with breast disease and of nurses.`,'s_agatha'],
'02-10':['s',`Scholastica (c. 480-543), twin sister of St. Benedict, led a community of nuns. Tradition says her prayer brought a storm, so she could speak with her brother about God through one last night.`],
'02-11':['m',`In 1858 Mary appeared eighteen times to Bernadette Soubirous at Lourdes in France and called herself the Immaculate Conception. Lourdes became a place of prayer for the sick, and this is also the World Day of the Sick.`],
'02-14':['s',`Cyril and Methodius, brothers from Thessalonica in the 800s, brought the Gospel to the Slavic peoples and created an alphabet for their language. They are patrons of Europe.`],
'02-22':['l',`This feast honors the mission Christ gave to Peter, to lead and strengthen the Church (Matthew 16:18-19), and the unity of the Church around his successor, the Pope.`,0,'Saint Peter, pray for us.'],
'03-07':['s',`Perpetua, a young noblewoman and mother, and Felicity, a slave who had just given birth, were martyred together at Carthage in 203. Perpetua's own account of her imprisonment survives.`],
'03-17':['s',`Patrick (5th century) was taken from Britain to Ireland as a slave, escaped, and later returned as a bishop to preach the Gospel. Tradition says he used the shamrock to explain the Trinity.`,'patrick'],
'03-19':['s',`Joseph, a just man and a carpenter of Nazareth, was the husband of Mary and the foster father of Jesus. He protected the Holy Family and is patron of the universal Church.`,'joseph'],
'03-25':['l',`The angel Gabriel announces to Mary that she will bear the Son of God, and she says yes (Luke 1:26-38). The Word becomes flesh, nine months before Christmas.`,'angelus'],
'04-25':['s',`Mark, a companion of Peter and Paul, wrote the earliest and shortest Gospel. His symbol is the lion, and tradition says he founded the Church in Alexandria.`],
'04-29':['s',`Catherine of Siena (1347-1380) was a laywoman of deep prayer who cared for the sick and urged the Pope to return from Avignon to Rome. She is a Doctor of the Church and a patron of Europe and Italy.`,'s_cath'],
'05-01':['s',`Pius XII set this feast in 1955 to honor the dignity of human work, after Joseph the carpenter, who worked to provide for Jesus and Mary.`,'s_joseph','Saint Joseph, pray for us.'],
'05-03':['s',`Philip, from Bethsaida, brought Nathanael to Jesus. James, son of Alphaeus, is often called James the Less. Both were apostles who gave their lives preaching Christ.`],
'05-13':['m',`In 1917 Mary appeared six times to three shepherd children at Fatima in Portugal, asking for prayer, penance, and the daily Rosary. Two of the children, Francisco and Jacinta Marto, are now saints.`,'fatima'],
'05-14':['s',`Matthias was chosen by lot to take the place of Judas among the Twelve (Acts 1:21-26). He had followed Jesus from his baptism to the Ascension.`],
'05-22':['s',`Rita of Cascia (1381-1457) endured a hard marriage and lost her husband and sons, then became an Augustinian nun. She is patron of impossible causes.`],
'05-26':['s',`Philip Neri (1515-1595), the joyful apostle of Rome, drew people to God through humor, warmth, and prayer, and founded the Oratory.`],
'05-31':['m',`Mary hurries to visit her cousin Elizabeth, the child in Elizabeth's womb leaps for joy, and Mary sings the Magnificat (Luke 1:39-56).`,'magnificat'],
'06-13':['s',`Anthony of Padua (1195-1231), a Franciscan from Lisbon, was a powerful preacher and is a Doctor of the Church. Many ask his help to find lost things.`,'s_anthony'],
'06-21':['s',`Aloysius Gonzaga (1568-1591) gave up a noble inheritance to become a Jesuit. He died at 23 after caring for plague victims in Rome. He is patron of young people.`],
'06-22':['s',`Thomas More, Chancellor of England, and John Fisher, Bishop of Rochester, were executed in 1535 for refusing to accept the king as head of the Church in England.`],
'06-24':['s',`John the Baptist, son of Zechariah and Elizabeth, prepared the way for Jesus and baptized him in the Jordan. Only he, Mary, and Jesus have their births celebrated in the Church's calendar.`,'benedictus','Saint John the Baptist, pray for us.'],
'06-29':['s',`Peter, the fisherman Jesus made the rock of his Church, and Paul, the apostle to the nations, were both martyred in Rome under the emperor Nero.`,'e_paul'],
'07-03':['s',`Thomas doubted the Resurrection until he saw the risen Jesus, then made the great confession: My Lord and my God (John 20:28). Tradition says he preached the Gospel in India.`],
'07-11':['s',`Benedict of Nursia (c. 480-547) founded the monastery of Monte Cassino and wrote the Rule that shaped monastic life in the West: pray and work. He is a patron of Europe.`,'s_ben'],
'07-16':['m',`Mount Carmel in the Holy Land was home to hermits who became the Carmelite order, devoted to Mary. Many Catholics wear the brown scapular as a sign of her protection.`],
'07-22':['s',`Mary Magdalene, freed by Jesus from seven demons, followed him to the cross and was the first to see him risen (John 20:11-18). She is called the apostle to the apostles.`,'s_magd'],
'07-23':['s',`Bridget of Sweden (1303-1373), a wife, mother of eight, and later a widow, founded the Order of the Most Holy Saviour, the Bridgettines. She is a patron of Europe, and the Fifteen Prayers in this app are linked to her name.`,'br1'],
'07-25':['s',`James, son of Zebedee and brother of John, was the first of the apostles to be martyred (Acts 12:2). His shrine at Santiago de Compostela in Spain draws pilgrims from all over the world.`],
'07-26':['s',`By tradition, Joachim and Anne were the parents of the Virgin Mary and the grandparents of Jesus. They are patrons of grandparents.`],
'07-29':['s',`Olaf Haraldsson, King of Norway, worked to bring the Christian faith to Norway and died at the Battle of Stiklestad in 1030. He is patron of Norway, and his feast, Ólavsøka, is the Faroese national day.`,0,'Saint Olaf, pray for us.'],
'07-31':['s',`Ignatius of Loyola (1491-1556), a Spanish soldier who turned to God while recovering from a wound, founded the Jesuits and wrote the Spiritual Exercises. His motto: for the greater glory of God.`,'ignatius'],
'08-01':['s',`Alphonsus Liguori (1696-1787), a lawyer who became a priest, founded the Redemptorists and wrote much on prayer and on Mary. He is a Doctor of the Church.`],
'08-04':['s',`John Vianney (1786-1859), the parish priest of Ars in France, spent many hours a day hearing confessions. He is patron of parish priests.`],
'08-06':['l',`On the mountain Jesus is transfigured in glory before Peter, James, and John, and the Father says: This is my beloved Son; listen to him (Mark 9:2-8).`],
'08-08':['s',`Dominic (1170-1221) founded the Order of Preachers, the Dominicans, to preach the Gospel. The Rosary has long been linked with his name.`],
'08-09':['s',`Edith Stein (1891-1942), a Jewish philosopher, became a Catholic and a Carmelite nun, taking the name Teresa Benedicta of the Cross. She was killed at Auschwitz and is a patron of Europe.`],
'08-10':['s',`Lawrence, a deacon of Rome, cared for the poor and was martyred in 258. Tradition says that when he was ordered to hand over the Church's treasures, he presented the poor.`],
'08-11':['s',`Clare of Assisi (1194-1253), inspired by St. Francis, founded the Poor Clares, a life of poverty and prayer.`],
'08-14':['s',`Maximilian Kolbe (1894-1941), a Polish Franciscan priest, gave his life in place of a father of a family at Auschwitz. He is patron of prisoners.`],
'08-15':['m',`At the end of her earthly life, Mary was taken up body and soul into heavenly glory. Pius XII defined this as dogma in 1950.`],
'08-22':['m',`One week after the Assumption, the Church honors Mary as Queen of heaven and earth, crowned in glory beside her Son.`,'queen'],
'08-24':['s',`Bartholomew, one of the Twelve, is often identified with Nathanael, of whom Jesus said: here is a true Israelite, in whom there is no deceit (John 1:47).`],
'08-27':['s',`Monica (331-387) prayed for many years for her son Augustine, who finally turned to Christ. She is patron of mothers and of all who pray for loved ones far from God.`],
'08-28':['s',`Augustine of Hippo (354-430) lived a restless youth before his conversion, then became a bishop and one of the greatest teachers of the Church. His Confessions tell his story.`,'augustine'],
'09-08':['m',`The Church celebrates the birthday of the Virgin Mary, nine months after the feast of her Immaculate Conception.`],
'09-14':['l',`This feast honors the cross of Christ, once an instrument of death and now the sign of salvation. Tradition links it to St. Helena's finding of the true cross in Jerusalem.`,'stn12'],
'09-15':['m',`The day after the feast of the Cross, the Church honors the sorrows of Mary, above all her standing at the foot of the cross (John 19:25-27). The Seven Sorrows chaplet is in the Devotions tab.`],
'09-21':['s',`Matthew, a tax collector, left his table when Jesus said: Follow me (Matthew 9:9). He became an apostle and wrote the first Gospel.`],
'09-23':['s',`Pio of Pietrelcina (1887-1968), a Capuchin friar known as Padre Pio, bore the wounds of Christ for fifty years and spent long hours hearing confessions.`,'s_pio'],
'09-27':['s',`Vincent de Paul (1581-1660), a French priest, gave his life to serving the poor, the sick, and prisoners. He founded the Vincentians and, with St. Louise de Marillac, the Daughters of Charity.`],
'09-29':['a',`Michael defends God's people against evil, Gabriel brought the good news to Mary, and Raphael guided Tobias and healed his father (Book of Tobit).`,'e_tax','Holy Archangels Michael, Gabriel, and Raphael, pray for us.'],
'09-30':['s',`Jerome (c. 347-420) translated the Bible into Latin, the Vulgate. He taught that ignorance of Scripture is ignorance of Christ. He is patron of translators.`],
'10-01':['s',`Therese of Lisieux (1873-1897), a Carmelite nun who died at 24, taught the Little Way: doing small things with great love. She is a Doctor of the Church and patron of missions.`,'s_therese'],
'10-02':['a',`The Church celebrates the angels God gives to guard each person (Matthew 18:10).`,'angel','Holy Guardian Angels, pray for us.'],
'10-04':['s',`Francis of Assisi (1181-1226) left his wealth to live in poverty, joy, and love for all creation, and founded the Franciscans.`,'s_fran1'],
'10-07':['m',`This feast gives thanks for Mary's help through the Rosary. It began after the naval battle of Lepanto in 1571, when Christians across Europe prayed the Rosary.`,'queen'],
'10-15':['s',`Teresa of Avila (1515-1582), a Spanish Carmelite, reformed her order and wrote classic works on prayer such as The Interior Castle. In 1970 she became the first woman named a Doctor of the Church.`,'s_teresa'],
'10-18':['s',`Luke, a physician and companion of St. Paul, wrote the Gospel of Luke and the Acts of the Apostles. His Gospel shows the mercy of Jesus to the poor and to sinners.`,'s_luke'],
'10-22':['s',`Karol Wojtyla (1920-2005) from Poland was Pope from 1978 to 2005. He traveled the world, began World Youth Day, and spoke tirelessly for human dignity. His famous call: Be not afraid.`],
'10-28':['s',`Simon the Zealot and Jude Thaddeus were apostles who, by tradition, preached together and were martyred. Jude is patron of desperate cases.`],
'11-01':['s',`The Church honors all the saints in heaven, known and unknown, and remembers that every one of us is called to be holy.`,'saints','All holy men and women, pray for us.'],
'11-02':['d',`The Church prays for all the faithful departed who are being purified before entering heaven. It is a day to remember and pray for those we have lost.`,'eternal','Eternal rest grant unto them, O Lord, and let perpetual light shine upon them.'],
'11-03':['s',`Martin de Porres (1579-1639), a Dominican brother in Lima, Peru, of Spanish and African descent, cared for the sick and the poor of every background. He is patron of racial harmony.`],
'11-04':['s',`Charles Borromeo (1538-1584), Archbishop of Milan, worked to renew the Church after the Council of Trent, founded seminaries, and stayed to care for his people during the plague.`],
'11-09':['l',`The Lateran Basilica in Rome is the Pope's cathedral, called the mother and head of all churches. Its feast celebrates unity with the Church of Rome.`],
'11-11':['s',`Martin of Tours (c. 316-397), a Roman soldier, cut his cloak in half for a freezing beggar and later saw Christ wearing it in a dream. He became a monk and a bishop.`,'s_martin'],
'11-15':['s',`Albert the Great (c. 1200-1280), a German Dominican, was a scientist, philosopher, and the teacher of St. Thomas Aquinas. He is patron of scientists.`],
'11-17':['s',`Elizabeth of Hungary (1207-1231), a princess, used her wealth to build a hospital and to serve the poor with her own hands. She died at 24.`],
'11-22':['s',`Cecilia was an early Roman martyr. Tradition says she sang to God in her heart, so she is patron of music and musicians.`],
'11-25':['s',`Catherine of Alexandria, by tradition a learned young woman of the early 300s, defended the faith before scholars and was martyred. She is patron of students and philosophers.`],
'11-30':['s',`Andrew, a fisherman and the brother of Peter, was first a disciple of John the Baptist and then brought Peter to Jesus (John 1:40-42). He is patron of Scotland.`],
'12-03':['s',`Francis Xavier (1506-1552), one of the first Jesuits, preached the Gospel in India, Southeast Asia, and Japan. He is patron of missions.`],
'12-06':['s',`Nicholas, a bishop of Myra in the 300s, was known for secret generosity to people in need. He inspired the figure of Santa Claus.`],
'12-07':['s',`Ambrose (c. 340-397), Bishop of Milan, was a great preacher and a defender of the Church. He baptized St. Augustine and is a Doctor of the Church.`],
'12-08':['m',`The Church celebrates that Mary was preserved from original sin from the first moment of her conception, by the grace of God. Pius IX defined this dogma in 1854.`,'subtuum'],
'12-12':['m',`In 1531 Mary appeared to Juan Diego, an Indigenous man, near Mexico City, and left her image on his cloak. She is patroness of the Americas.`],
'12-13':['s',`Lucy was a young martyr of Syracuse in Sicily, around 304. Her name means light, and her feast is kept with candles in the dark of the Nordic winter.`],
'12-14':['s',`John of the Cross (1542-1591), a Carmelite friar, helped St. Teresa of Avila reform their order. While imprisoned he wrote some of the greatest poems of Spanish literature. He is a Doctor of the Church.`],
'12-25':['l',`Christmas: the Son of God is born of the Virgin Mary in Bethlehem. The Word became flesh and dwelt among us (John 1:14).`],
'12-26':['s',`Stephen, one of the first deacons, was stoned to death while forgiving his killers (Acts 7). He is the first Christian martyr.`],
'12-27':['s',`John, the beloved disciple, stood at the cross and took Mary into his home. He wrote the Gospel of John and three letters, and by tradition the Book of Revelation.`,'s_john'],
'12-28':['s',`The Holy Innocents were the little boys of Bethlehem killed by King Herod in his attempt to kill the infant Jesus (Matthew 2:16-18).`,0,'Holy Innocents, pray for us.']
};

'Corpus Christi (a Sunday in some countries)':['l',`The feast of the Body and Blood of Christ celebrates Jesus truly present in the Eucharist, often with a procession through the streets.`,'anima'],

'Immaculate Heart of Mary':['m',`The day after the Sacred Heart, the Church honors the heart of Mary, who kept all these things and pondered them in her heart (Luke 2:19).`],
'Christ the King':['l',`On the last Sunday of the Church's year, we honor Jesus as King of the universe, whose kingdom is truth, love, and peace.`]

// ===== Journeys: content =====
// [title, suggested reading, reflection, small step]
var ADV=[
['Stay awake','Mark 13:33-37',`Advent begins with Jesus' call to be watchful. Not anxious, but alert, the way you wait for someone you love to come home.`,`Set aside five quiet minutes today with your phone in another room.`],
['Walk in the light','Isaiah 2:1-5',`Isaiah sees the nations streaming to the Lord's mountain and swords beaten into ploughshares. Advent is a season of hope for a world at peace.`,`Pray for peace in one place of conflict you have heard about.`],
['Only say the word','Matthew 8:5-11',`The centurion trusts that one word from Jesus is enough. His words are still spoken before Communion at every Mass.`,`Bring one need to Jesus in a single, simple sentence.`],
['A shoot from the stump','Isaiah 11:1-10',`From a stump that looks dead, new life springs. God often begins where we have given up.`,`Name one situation where you need hope, and give it to God.`],
['The Lord is my light','Psalm 27:1-14',`The psalmist asks for one thing only: to dwell in the house of the Lord and gaze on his beauty.`,`Pray Psalm 27:1 when you wake and before you sleep.`],
['Built on rock','Matthew 7:21-27',`Hearing Jesus is not enough; the wise build their lives on his words.`,`Choose one teaching of Jesus and act on it today.`],
['Compassion for the crowds','Matthew 9:35-10:1',`Jesus sees the tired and harassed crowds and his heart goes out to them.`,`Do one kind thing for someone who looks tired or alone.`],
['Prepare the way','Mark 1:1-8',`John the Baptist calls people to turn back to God. Preparing for Christmas starts in the heart.`,`Plan a time to go to Confession before Christmas.`],
['Comfort my people','Isaiah 40:1-11',`God speaks tenderly and carries his people like a shepherd carries lambs.`,`Send a message of comfort to someone who is grieving or struggling.`],
['Through the roof','Luke 5:17-26',`Friends lower a paralyzed man through a roof to reach Jesus. Their faith carries him.`,`Pray by name for a friend, bringing them to Jesus the way those friends did.`],
['The one who is lost','Matthew 18:12-14',`The shepherd leaves the ninety-nine to find the one that wandered off. No one is forgotten.`,`Reach out to someone you have lost touch with.`],
['Come to me','Matthew 11:28-30',`Jesus invites the weary and burdened to rest in him.`,`Bring your heaviest worry to God, and try to leave it with him.`],
['Do not fear','Isaiah 41:13-20',`The Lord takes us by the hand and says: Do not fear, I will help you.`,`Write down one fear, and pray over it.`],
['Wisdom is shown in her deeds','Matthew 11:16-19',`People found reasons to dismiss both John and Jesus. It is easy to be busy and miss God.`,`Turn off one distraction tonight and pray instead.`],
['Rejoice in the Lord always','Philippians 4:4-7',`The third week of Advent is about joy: the Lord is near. Do not worry about anything, but bring everything to God with thanksgiving.`,`Thank God for three specific gifts from this week.`],
['What should we do?','Luke 3:10-18',`John's answer is practical: whoever has two coats should share with the one who has none.`,`Give something away to someone in need.`],
['The desert will bloom','Isaiah 35:1-10',`Dry land bursts into flower, the blind see, and the lame leap. God makes all things new.`,`Notice one beautiful thing in creation today, and praise God for it.`],
['Are you the one?','Matthew 11:2-11',`From prison, John sends Jesus an honest question. Jesus does not scold him; he answers.`,`Bring God an honest question of your own.`],
['Sing a new song','Psalm 96',`All creation is invited to rejoice before the Lord, for he comes.`,`Sing or listen to an Advent hymn, such as O Come, O Come, Emmanuel.`],
['My soul waits for the Lord','Psalm 130:5-6',`More than watchmen wait for the morning, we wait for the Lord. Waiting is itself a kind of prayer.`,`Spend five minutes in silent waiting before God.`]];

var OANT=[
['O Wisdom','O Sapientia','Sirach 24:3; Wisdom 8:1',`O Wisdom, who came forth from the mouth of the Most High, reaching from end to end and ordering all things mightily and sweetly: come, and teach us the way of prudence.`,`From today until Christmas, the Church sings one O Antiphon each evening. Pray this one slowly three times.`],
['O Lord and Ruler','O Adonai','Exodus 3:1-6',`O Adonai, and leader of the house of Israel, who appeared to Moses in the flame of the burning bush and gave him the law on Sinai: come, and with an outstretched arm redeem us.`,`Pray the antiphon, and thank God for one way he has guided you.`],
['O Root of Jesse','O Radix Jesse','Isaiah 11:10',`O Root of Jesse, who stands as a sign for the peoples, before whom kings shall keep silence and whom the nations shall seek: come, and deliver us, and delay no longer.`,`Pray the antiphon for someone who is waiting for help.`],
['O Key of David','O Clavis David','Isaiah 22:22',`O Key of David and scepter of the house of Israel, who opens and no one shuts, who shuts and no one opens: come, and lead the prisoner out of the prison house, those who sit in darkness and the shadow of death.`,`Ask Jesus to unlock one thing in you that feels stuck.`],
['O Dawn of the East','O Oriens','Malachi 4:2',`O Dayspring, splendor of eternal light and sun of justice: come, and give light to those who sit in darkness and the shadow of death.`,`Today is near the darkest day of the year. Light a candle and pray the antiphon.`],
['O King of the Nations','O Rex Gentium','Ephesians 2:14-20',`O King of the nations and their desire, the cornerstone who makes both one: come, and save the human race, which you fashioned from clay.`,`Pray for unity in your family and among Christians.`],
['O God with Us','O Emmanuel','Isaiah 7:14',`O Emmanuel, our King and lawgiver, the hope of the nations and their Savior: come and save us, O Lord our God.`,`Read the first letters of the Latin titles backwards: ERO CRAS, meaning tomorrow I will come.`],
['Tonight the waiting ends','Luke 2:1-14',`Tonight the Church celebrates the birth of the Savior. The Word became flesh and dwelt among us.`,`Go to Christmas Mass, and spend a moment in prayer at a crib.`]];
var LENT=[
['Return to me','Joel 2:12-18',`Lent begins with ashes and an invitation: return to the Lord with your whole heart. The three classic practices are prayer, fasting, and almsgiving.`,`Choose your Lent: one prayer to add, one thing to fast from, and one way to give.`],
['Choose life','Deuteronomy 30:15-20',`God sets before us life and death and asks us to choose life, by loving him and walking in his ways.`,`Pick one small daily choice that you will make for God this Lent.`],
['The fast God chooses','Isaiah 58:1-9',`The fast God wants is to free the oppressed, share bread with the hungry, and not turn away from our own.`,`Abstain from meat today, and give what you save to someone in need.`],
['Not the healthy, but the sick','Luke 5:27-32',`Jesus calls Levi the tax collector and eats with sinners. He came for people exactly like us.`,`Thank Jesus for calling you as you are.`],
['Into the desert','Matthew 4:1-11',`Jesus is tempted in the desert and answers each temptation with the word of God.`,`Learn one verse of Scripture by heart, to use when you are tempted.`],
['You did it to me','Matthew 25:31-46',`Whatever we do for the least of his brothers and sisters, we do for Jesus.`,`Do one work of mercy today (the list is in the Devotions tab, under Learn the Faith).`],
['When you pray','Matthew 6:7-15',`Jesus teaches us not to heap up words, and gives us the Our Father.`,`Pray the Our Father slowly, one phrase with each breath.`],
['The sign of Jonah','Luke 11:29-32',`The people of Nineveh turned back to God at Jonah's preaching. Someone greater than Jonah is here.`,`Name one thing you need to turn away from.`],
['Ask, seek, knock','Matthew 7:7-12',`The Father loves to give good things to those who ask him.`,`Ask God for one thing, with trust.`],
['First be reconciled','Matthew 5:20-26',`Before bringing a gift to the altar, Jesus says, go and make peace with your brother.`,`Make peace with someone, or pray for the grace to.`],
['Love your enemies','Matthew 5:43-48',`Jesus asks us to love our enemies and pray for those who persecute us.`,`Pray by name for someone who has hurt you.`],
['Listen to him','Mark 9:2-10',`On the mountain the disciples see Jesus in glory, and the Father says: Listen to him.`,`Read today's Gospel slowly, twice.`],
['Be merciful','Luke 6:36-38',`Be merciful as your Father is merciful. The measure you give is the measure you will receive.`,`Do not judge anyone today, and notice when you are tempted to.`],
['The greatest is the servant','Matthew 23:1-12',`Whoever humbles himself will be exalted.`,`Do one hidden task that nobody will thank you for.`],
['Can you drink the cup?','Matthew 20:17-28',`The Son of Man came not to be served but to serve, and to give his life.`,`Offer up a small discomfort today for someone who is suffering.`],
['The rich man and Lazarus','Luke 16:19-31',`The rich man was not cruel; he simply never saw the poor man at his gate.`,`Notice someone in need whom you usually walk past.`],
['The rejected stone','Matthew 21:33-43',`The stone the builders rejected has become the cornerstone.`,`Pray the Stations of the Cross (in the Devotions tab).`],
['The prodigal son','Luke 15:1-3, 11-32',`The father runs to meet his son while he is still far off. That is how God waits for us.`,`Go to Confession this week if you can.`],
['Living water','John 4:5-42',`At the well, Jesus offers a thirsty woman living water. He knows her whole story and does not turn away.`,`Tell Jesus honestly what you are thirsty for.`],
['No prophet in his own town','Luke 4:24-30',`Jesus was not accepted in his hometown. Faith can be hardest to share with those closest to us.`,`Pray for your family and friends, and trust God with their story.`],
['Seventy times seven','Matthew 18:21-35',`Peter asks how often he must forgive. Jesus answers: without counting.`,`Forgive one old hurt, even if only in prayer for now.`],
['To fulfill, not abolish','Matthew 5:17-19',`Jesus came to bring God's law to its fullness, which is love.`,`Read the Ten Commandments (Devotions, Catechism Q&A) and examine one.`],
['The stronger man','Luke 11:14-23',`Jesus is stronger than every evil. Whoever is not with him is against him.`,`Pray the Prayer to St. Michael.`],
['The greatest commandment','Mark 12:28-34',`Love God with all your heart, and your neighbor as yourself.`,`Show love to God and to one neighbor in a concrete way today.`],
['Two men went up to pray','Luke 18:9-14',`The tax collector simply says: God, be merciful to me, a sinner. He goes home justified.`,`Pray the Jesus Prayer several times today: Lord Jesus Christ, Son of God, have mercy on me, a sinner.`],
['I was blind, now I see','John 9:1-41',`Laetare Sunday: Lent is half over. Jesus opens the eyes of a man born blind.`,`Thank God for one way he has opened your eyes.`],
['Go, your son will live','John 4:43-54',`An official believes Jesus' word and goes home, and his son is healed.`,`Trust Jesus with one person you are worried about.`],
['Do you want to be healed?','John 5:1-16',`Jesus asks a man who has been ill for thirty-eight years whether he wants to get well.`,`Ask Jesus to heal one wound in you.`],
['The Father is at work','John 5:17-30',`The Son does what he sees the Father doing.`,`Offer your work today to God.`],
['The Scriptures speak of me','John 5:31-47',`All of Scripture points to Jesus.`,`Read one whole chapter of a Gospel.`],
['His hour had not yet come','John 7:1-2, 10, 25-30',`Opposition to Jesus grows, but he keeps doing the Father's will.`,`Fast from one comfort today.`],
['No one ever spoke like this','John 7:40-53',`Even the guards sent to arrest Jesus come back amazed at his words.`,`Share something good about Jesus with a friend, gently and without pressure.`],
['I am the resurrection','John 11:1-45',`Jesus weeps at the tomb of his friend Lazarus, then calls him out alive.`,`Pray for someone you love who has died.`],
['Neither do I condemn you','John 8:1-11',`Jesus does not condemn the woman caught in sin; he sends her out to begin again.`,`Receive God's mercy, and let go of shame over a sin you have already confessed.`],
['When you lift up the Son of Man','John 8:21-30',`When Jesus is lifted up on the cross, we will know who he is.`,`Spend a few minutes looking at a crucifix.`],
['The truth will set you free','John 8:31-42',`If you remain in my word, you will know the truth, and the truth will set you free.`,`Be fully honest in one difficult situation.`],
['Before Abraham was, I AM','John 8:51-59',`Jesus speaks the divine name. He is God with us.`,`Pray a Glory Be slowly, as an act of adoration.`],
['The Father is in me','John 10:31-42',`Even if you do not believe me, Jesus says, believe the works I do.`,`Pray the Sorrowful Mysteries of the Rosary.`],
['One man for the people','John 11:45-56',`The leaders decide that Jesus must die. Holy Week is near.`,`Plan which Holy Week services you will go to.`],
['Hosanna','Matthew 21:1-11',`Palm Sunday: the crowds welcome Jesus as king. Within days, many will turn against him.`,`Keep your palm near a crucifix or picture of Jesus this week.`],
['Mary anoints Jesus','John 12:1-11',`Mary of Bethany pours costly perfume on Jesus' feet, and the house fills with the fragrance.`,`Give Jesus something costly today: unhurried time in silent prayer.`],
['One of you will betray me','John 13:21-33, 36-38',`Judas goes out into the night, and Peter promises more than he can keep.`,`Pray for anyone you have let down, and for anyone who has let you down.`],
['Is it I, Lord?','Matthew 26:14-25',`Each disciple asks: Is it I? Today is sometimes called Spy Wednesday.`,`Examine your conscience tonight.`],
['He loved them to the end','John 13:1-15',`Holy Thursday: Jesus washes his disciples' feet and gives us the Eucharist.`,`Go to the evening Mass of the Lord's Supper, and stay a while to pray afterward.`],
['It is finished','John 18:1-19:42',`Good Friday: Jesus gives his life on the cross. It is a day of fasting and abstinence.`,`Fast today and venerate the cross at the afternoon service. The Divine Mercy novena traditionally begins today.`],
['The great silence','Matthew 27:57-66',`Holy Saturday: Jesus lies in the tomb, and the Church waits beside it in silence.`,`Keep the day quiet. Tonight, go to the Easter Vigil if you can.`]];

var CONS=[
['Why begin?','Romans 12:1-2',`For thirty-three days you will make room for God, so that you can give yourself entirely to Jesus through Mary. The first twelve days are about letting go of the spirit of the world.`],
['Two masters','Matthew 6:24',`No one can serve two masters. What competes with God for your heart: money, approval, comfort, control?`],
['Treasure in heaven','Matthew 6:19-21',`Where your treasure is, there your heart will be. What do you spend most of your time and thoughts on?`],
['The narrow gate','Matthew 7:13-14',`The way to life is narrow, and the easy road is crowded. Following Christ often means going against the current.`],
['Salt and light','Matthew 5:13-16',`You are salt and light for others. The world is not the enemy; it is the place we are sent.`],
['Do not love the world','1 John 2:15-17',`The world and its desires pass away, but whoever does the will of God remains forever.`],
['The rich young man','Mark 10:17-27',`Jesus looked at him and loved him, and asked for everything. He went away sad. What is Jesus asking of you?`],
['Seek first the kingdom','Matthew 6:25-34',`Do not worry about tomorrow. Seek God's kingdom first, and the rest will be given.`],
['Blessed are the poor in spirit','Matthew 5:1-12',`The Beatitudes turn the world's values upside down. Read them slowly as a portrait of Jesus.`],
['Pruned to bear fruit','John 15:1-8',`The Father prunes the branches that bear fruit. Some losses make room for new life.`],
['Our citizenship is in heaven','Philippians 3:17-21',`We are pilgrims here. Our true home is with God.`],
['Losing to find','Matthew 16:24-26',`Whoever loses his life for Christ will find it. Tomorrow you turn to knowing yourself.`],
['Search me, O God','Psalm 139:1-12, 23-24',`The next seven days are about knowing yourself honestly, as God knows you: completely, and with love.`],
['Gentle and humble of heart','Matthew 11:28-30',`Learn from me, Jesus says, for I am gentle and humble of heart. Where do you need his gentleness?`],
['The Pharisee and the tax collector','Luke 18:9-14',`Humility is simply the truth about ourselves before God.`],
['The log in my own eye','Matthew 7:1-5',`It is easier to see others' faults than our own. Ask the Holy Spirit to show you one of yours.`],
['Without me you can do nothing','John 15:5',`On our own we cannot become holy. Everything good is grace.`],
['My grace is enough','2 Corinthians 12:7-10',`God's power is made perfect in weakness. Your weakness is not an obstacle to him.`],
['Coming to himself','Luke 15:11-24',`The prodigal son came to himself and went home. Tomorrow you turn to knowing Mary.`],
['Full of grace','Luke 1:26-28',`The next seven days are about knowing Mary. God chose her and filled her with grace for her mission.`],
['Let it be done to me','Luke 1:29-38',`Mary's yes changed history. Her whole life was a yes to God.`],
['Mary hurries','Luke 1:39-56',`Mary carries Jesus to others. Real devotion to her always leads to Jesus and to serving others.`],
['She pondered in her heart','Luke 2:15-19',`Mary kept everything and pondered it in her heart. She teaches us contemplation.`],
['A sword will pierce your heart','Luke 2:33-35',`Mary's love cost her suffering. She understands ours.`],
['Do whatever he tells you','John 2:1-11',`Mary's last recorded words in the Gospels point away from herself to Jesus.`],
['Behold your mother','John 19:25-27',`From the cross, Jesus gives Mary to his disciple as his mother, and to us. Tomorrow you turn to knowing Jesus.`],
['The Word became flesh','John 1:1-14',`The last seven days are about knowing Jesus Christ, the goal of everything. God became one of us.`],
['All the treasures of wisdom','Colossians 2:2-3',`St. Louis de Montfort called Jesus the Eternal Wisdom. In him are hidden all the treasures of wisdom and knowledge.`],
['The Good Shepherd','John 10:11-16',`He knows his sheep by name and lays down his life for them.`],
['The bread of life','John 6:35, 51',`Jesus gives himself to us in the Eucharist. If you can, go to Mass on one weekday this week.`],
['No greater love','John 15:12-15',`Jesus no longer calls us servants, but friends.`],
['Obedient unto death','Philippians 2:5-11',`He emptied himself, even to death on a cross, and God exalted him above every name.`],
['I am with you always','Matthew 28:18-20',`Tomorrow is your consecration day. If you can, go to Confession beforehand and to Mass tomorrow.`]];

P.avemaris=['Hymn: Ave Maris Stella',`Hail, thou Star of Ocean,
Portal of the sky,
Ever Virgin Mother
Of the Lord most high.

O, by Gabriel's Ave,
Uttered long ago,
Eva's name reversing,
Establish peace below.

Break the captives' fetters,
Light on blindness pour,
All our ills expelling,
Every bliss implore.

Show thyself a Mother;
Offer him our sighs,
Who for us incarnate
Did not thee despise.

Virgin of all virgins,
To thy shelter take us;
Gentlest of the gentle,
Chaste and gentle make us.

Still, as on we journey,
Help our weak endeavour,
Till with thee and Jesus
We rejoice for ever.

Through the highest heaven,
To the Almighty Three,
Father, Son, and Spirit,
One same glory be. Amen.`];

P.consact=['Act of Consecration (St. Louis de Montfort, short form)',`I, (name), a faithless sinner, renew and ratify today in thy hands, O Immaculate Mother, the vows of my Baptism. I renounce forever Satan, his pomps and works, and I give myself entirely to Jesus Christ, the Incarnate Wisdom, to carry my cross after him all the days of my life, and to be more faithful to him than I have ever been before.

In the presence of all the heavenly court, I choose thee this day for my Mother and Mistress. I deliver and consecrate to thee, as thy slave, my body and soul, my goods both interior and exterior, and even the value of all my good actions, past, present, and future, leaving to thee the entire and full right of disposing of me and all that belongs to me, without exception, according to thy good pleasure, for the greater glory of God, in time and in eternity. Amen.`];
